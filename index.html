<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="description" content="入ってくるお金を、どの口座にいくら分けるかを決める家計簿">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- フォント：Google Fonts。文字は Noto Sans JP（Regular 400・Medium 500・SemiBold 600）、数字は Barlow（DIN 2014 は Google Fonts にないため、DIN に近い Barlow を数字と記号だけ読み込む） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&text=0123456789%2C.%C2%A5-%E2%88%92%2B%25&display=swap">
<style>
/* iOS のシステムカラーと背景にそろえる */
:root {
  color-scheme: light;
  --bg: #f2f2f7; --card: #ffffff; --sheet-bg: #f2f2f7; --sheet-card: #ffffff;
  --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29); --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.2); --pressed: rgba(0,0,0,.06);
  --blue: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500; --pink: #ff2d55; --indigo: #5856d6; --gray: #8e8e93;
  --bar: rgba(249,249,249,.82); --bar-line: rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.08);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --pink: #ff375f; --indigo: #5e5ce6; --gray: #8e8e93;
    --bar: rgba(22,22,24,.8); --bar-line: rgba(255,255,255,.15);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
  --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.08);
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --pink: #ff375f; --indigo: #5e5ce6; --gray: #8e8e93;
  --bar: rgba(22,22,24,.8); --bar-line: rgba(255,255,255,.15);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--label);
  font-family: "Barlow", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  font-weight: 400; font-size: 17px; line-height: 1.4; letter-spacing: .01em;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
.num { font-variant-numeric: tabular-nums; }
.ms { width: 1.2em; height: 1.2em; fill: currentColor; flex: none; }

/* 上の帯（すりガラス） */
.nav { position: sticky; top: 0; z-index: 20; height: calc(44px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; justify-content: space-between;
  background: transparent; transition: background .2s; }
.nav.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--bar-line); }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
.nav.scrolled .nav-title { opacity: 1; }
.nav-left, .nav-right { display: flex; align-items: center; gap: 2px; min-width: 80px; }
.nav-right { justify-content: flex-end; }
.text-btn { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 8px; border-radius: 8px; min-height: 44px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--blue); display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon-btn .ms { width: 28px; height: 28px; }
.icon-btn.small { width: 36px; height: 36px; }
.icon-btn.small .ms { width: 22px; height: 22px; }
.icon-btn:disabled { color: var(--label3); }
.text-btn:active, .icon-btn:active { opacity: .4; }

main { max-width: 600px; margin: 0 auto; overflow-x: clip; }
html, body { overflow-x: hidden; }
.view { display: none; }
.view.active { display: block; }
.view.slide-l { animation: slideL .28s cubic-bezier(.2,.8,.2,1); }
.view.slide-r { animation: slideR .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slideL { from { transform: translateX(30px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-30px); opacity: .3; } to { transform: none; opacity: 1; } }

/* 大きい題名 */
.large-title { padding: 0 20px 6px; }
.large-title h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }
.lt-sub { font-size: 15px; color: var(--label2); }

/* のこり（いちばん大事な数字） */
.hero { text-align: center; padding: 10px 16px 22px; }
.hero .cap { font-size: 15px; color: var(--label2); }
.hero .big { font-size: 48px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.hero .big.neg { color: var(--red); }
.hero .cap2 { font-size: 13px; color: var(--label2); margin-top: 6px; }
.hero.small { padding: 6px 16px 18px; }
.hero.small .big { font-size: 40px; }
.hero.small .tile { width: 44px; height: 44px; border-radius: 11px; margin: 0 auto 8px; }
.hero.small .tile .ms { width: 28px; height: 28px; }
.pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 5px 12px; border-radius: 999px; font-size: 15px; font-weight: 600; }
.pill .ms { width: 18px; height: 18px; }
.pill.neg { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.pill.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.empty-state { text-align: center; color: var(--label2); padding: 24px 20px 8px; }

/* まとまり（角丸のリスト） */
.group { margin: 0 16px 24px; background: var(--card); border-radius: 12px; overflow: hidden; }
.sheet .group { background: var(--sheet-card); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 32px 7px; font-size: 13px; color: var(--label2); }
.group-foot { margin: -17px 32px 24px; font-size: 13px; color: var(--label2); line-height: 1.4; }
.head-btn { background: none; border: 0; color: var(--blue); font-size: 15px; padding: 0; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 16px; width: 100%; border: 0; background: transparent; text-align: left; font-size: 17px; }
.cell::before { content: ''; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 1px; background: var(--sep); transform: scaleY(.5); transform-origin: top; }
.group > .cell:first-child::before, .group > .swipe:first-child .cell::before, .group > label.cell:first-child::before { display: none; }
.cell:has(.tile) { --inset: 57px; }
.cell.acc { --inset: 99px; padding-left: 8px; gap: 4px; }
.cell.link:active, .acc-open:active { background: var(--pressed); }
.cell .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cell .title { font-size: 17px; }
.cell .title.blue { color: var(--blue); }
.cell .title.red { color: var(--red); }
.cell .sub { font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.cell .sub-only { color: var(--label2); }
.cell .value { color: var(--label2); white-space: nowrap; }
.cell .value.strong { color: var(--label); font-weight: 500; }
.cell .value.zero { color: var(--label3); }
.cell .verb { font-size: 15px; color: var(--label2); white-space: nowrap; }
.chev { width: 20px; height: 20px; fill: var(--label3); margin-right: -6px; }
.chev-space { width: 14px; flex: none; }
.center-cell { justify-content: center; }
.add-ic { width: 26px; height: 26px; fill: var(--green); }
.add-cell { --inset: 54px; }
.code-box { width: 100%; border: 0; background: transparent; padding: 12px 16px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.4; resize: vertical; outline: none; color: var(--label); word-break: break-all; }
.center-text { text-align: center; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); border-radius: 6px; padding: 1px 6px; vertical-align: 2px; }

/* 色付きの角丸アイコン（iPhone の設定アプリと同じ形） */
.tile { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
.tile .ms { width: 20px; height: 20px; fill: #fff; }

/* 口座の行 */
.acc-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 6px 0; text-align: left; min-height: 56px; border-radius: 8px; }
.ring { flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.ring .ms { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--label3); fill: transparent; padding: 3px; box-sizing: border-box; transition: background .15s, border-color .15s; }
.ring[aria-checked="true"] .ms { background: var(--blue); border-color: var(--blue); fill: #fff; }
.ring-space { width: 44px; flex: none; }
.cell.acc.is-done .value.strong { color: var(--label2); text-decoration: line-through; }

/* スワイプ */
.swipe { position: relative; overflow: hidden; touch-action: pan-y; }
.swipe-content { position: relative; background: inherit; z-index: 1; will-change: transform; }
.group .swipe-content { background: var(--card); }
.sheet .group .swipe-content { background: var(--sheet-card); }
.swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; visibility: hidden; }
.swipe.moving .swipe-actions, .swipe.open .swipe-actions { visibility: visible; }
.sw-btn { border: 0; color: #fff; min-width: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; padding: 0 12px; }
.sw-btn .ms { width: 22px; height: 22px; fill: #fff; }
.sw-btn.green { background: var(--green); }
.sw-btn.gray { background: var(--gray); }
.sw-btn.red { background: var(--red); }

/* 入力の行（左に名前、右に値） */
.cell.form { gap: 12px; }
.cell.form .label { flex: none; min-width: 84px; display: flex; flex-direction: column; }
.cell.form .label small { font-size: 12px; color: var(--label2); }
.cell.form.icon .label { flex: 1; }
.cell.form input { flex: 1; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 17px; padding: 6px 0; outline: none; color: var(--label); }
.cell.form.icon input { flex: 0 1 140px; }
.cell.form input::placeholder { color: var(--label3); }
.cell .unit { color: var(--label2); }
.picker { cursor: pointer; }
.picker .picked { flex: 1; text-align: right; color: var(--label2); }
.picker select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }

/* iOS のスイッチ */
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }

/* 大きいボタン */
.pad { padding: 0 16px 24px; }
.save-pad { padding-top: 4px; }
.big-btn { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.big-btn.done { background: var(--fill); color: var(--green); }
.big-btn .ms { width: 22px; height: 22px; }
.big-btn:active { opacity: .7; }

/* 金額だけ変える画面 */
.sheet-lead { margin: 4px 32px 14px; font-size: 15px; color: var(--label2); }
.sheet-lead.center { text-align: center; }
.amount-big { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 0 16px; }
.amount-big .yen { font-size: 32px; font-weight: 600; color: var(--label2); }
.amount-big input { width: 2ch; max-width: calc(100vw - 80px); border: 0; background: transparent; font-size: 52px; font-weight: 600; text-align: center; outline: none; padding: 0; color: var(--label); }
.amount-big input::placeholder { color: var(--label3); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 16px 24px; }
.chip { border: 0; background: var(--fill); color: var(--blue); border-radius: 999px; padding: 8px 14px; font-size: 15px; min-height: 36px; }
.chip:active { opacity: .6; }

/* シート */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet-back.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; height: calc(100% - 44px - env(safe-area-inset-top)); z-index: 41; background: var(--sheet-bg); border-radius: 12px 12px 0 0;
  transform: translateY(105%); transition: transform .38s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; box-shadow: 0 -2px 20px rgba(0,0,0,.12); }
.sheet:not(.open) { visibility: hidden; transition: transform .38s cubic-bezier(.32,.72,0,1), visibility 0s .38s; }
.sheet.open { transform: translateY(0); visibility: visible; }
.sheet-grip { flex: none; padding: 6px 8px 4px; touch-action: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 0 auto 4px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head .text-btn:last-child { justify-self: end; font-weight: 600; }
.sheet-head .text-btn:first-child { justify-self: start; }
.sheet-head .text-btn.icon-only .ms { width: 26px; height: 26px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sheet-body.fade { animation: fadeIn .22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* アクションシート（確認） */
.action-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.action-back.open { opacity: 1; pointer-events: auto; }
.action-box { width: 100%; max-width: 600px; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); transform: translateY(30px); transition: transform .25s cubic-bezier(.32,.72,0,1); }
.action-back.open .action-box { transform: none; }
.as-group { background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; margin-top: 8px; }
.as-group:last-child { background: var(--card); }
.as-msg { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label2); display: flex; flex-direction: column; gap: 4px; }
.as-msg b { font-weight: 600; }
.as-btn { display: block; width: 100%; min-height: 57px; border: 0; background: none; color: var(--blue); font-size: 20px; border-top: .5px solid var(--sep); }
.as-btn.red { color: var(--red); }
.as-btn.bold { font-weight: 600; border-top: 0; }
.as-btn:active { background: var(--pressed); }

/* 下のタブ（すりガラス） */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 -.5px 0 var(--bar-line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: grid; grid-template-columns: 1fr 1fr; max-width: 600px; margin: 0 auto; padding: 0; list-style: none; }
.tabbar button { width: 100%; height: 50px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; color: var(--gray); }
.tabbar button .ms { width: 26px; height: 26px; }
.tabbar button .ms.on, .tabbar button[aria-current="page"] .ms:not(.on) { display: none; }
.tabbar button[aria-current="page"] .ms.on { display: block; }
.tabbar button[aria-current="page"] { color: var(--blue); }

/* お知らせ */
.toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 70; background: rgba(30,30,32,.92); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px;
  display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity .2s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: none; color: #64d2ff; font-weight: 600; font-size: 15px; padding: 0; white-space: nowrap; }

/* ===== グラスモーフィズム：色のついた背景の上に、すりガラスのパネルを重ねる ===== */
:root {
  --page: #eef1f8;
  --blob1: rgba(10,132,255,.48); --blob2: rgba(175,82,222,.40); --blob3: rgba(255,55,95,.30); --blob4: rgba(48,209,88,.30);
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.86); --glass-solid: rgba(255,255,255,.94);
  --glass-line: rgba(255,255,255,.75); --glass-shadow: 0 10px 30px rgba(40,50,110,.12), inset 0 1px 0 rgba(255,255,255,.6);
  --label2: rgba(40,40,50,.66);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06070c;
    --blob1: rgba(10,132,255,.42); --blob2: rgba(175,82,222,.36); --blob3: rgba(255,55,95,.26); --blob4: rgba(48,209,88,.20);
    --glass: rgba(40,40,48,.45); --glass-strong: rgba(30,30,36,.84); --glass-solid: rgba(44,44,50,.96);
    --glass-line: rgba(255,255,255,.14); --glass-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    --label2: rgba(235,235,245,.68);
  }
}
:root[data-theme="dark"] {
  --page: #06070c;
  --blob1: rgba(10,132,255,.42); --blob2: rgba(175,82,222,.36); --blob3: rgba(255,55,95,.26); --blob4: rgba(48,209,88,.20);
  --glass: rgba(40,40,48,.45); --glass-strong: rgba(30,30,36,.84); --glass-solid: rgba(44,44,50,.96);
  --glass-line: rgba(255,255,255,.14); --glass-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  --label2: rgba(235,235,245,.68);
}
body { background: var(--page); }
body::before { content: ''; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 35% at 15% 12%, var(--blob1), transparent 70%),
    radial-gradient(38% 32% at 88% 22%, var(--blob2), transparent 70%),
    radial-gradient(45% 35% at 75% 88%, var(--blob3), transparent 70%),
    radial-gradient(40% 35% at 8% 78%, var(--blob4), transparent 70%); }
.glass, .group, .hero, .sheet, .as-group, .toast, .chip {
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
}
.group { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--glass-shadow); }
.hero { margin: 4px 16px 24px; padding: 18px 16px 20px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 24px; box-shadow: var(--glass-shadow); }
.hero.small { margin-top: 0; }
.sheet { background: var(--glass-strong); border: 1px solid var(--glass-line); border-bottom: 0; border-radius: 20px 20px 0 0; }
.sheet .group { background: var(--glass); }
.group .swipe-content, .sheet .group .swipe-content { background: transparent; }
.swipe.moving .swipe-content, .swipe.open .swipe-content { background: var(--glass-solid); }
.cell::before { background: var(--glass-line); transform: none; height: 1px; opacity: .9; }
:root[data-theme="dark"] .cell::before { background: rgba(255,255,255,.1); }
.tile { background-image: linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.12); }
.pill { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.chip { background: var(--glass); border: 1px solid var(--glass-line); }
.big-btn { background: linear-gradient(135deg, #0a84ff, #5e5ce6); box-shadow: 0 8px 20px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.35); }
.big-btn.done { background: var(--glass); color: var(--green); box-shadow: var(--glass-shadow); border: 1px solid var(--glass-line); }
.as-group { background: var(--glass-strong); border: 1px solid var(--glass-line); }
.as-group:last-child { background: var(--glass-solid); }
.toast { background: rgba(20,20,28,.72); border: 1px solid rgba(255,255,255,.14); }
.nav.scrolled, .tabbar { background: var(--glass); border-color: var(--glass-line); }
.tabbar { box-shadow: 0 -1px 0 var(--glass-line); }
.sheet-back { background: rgba(10,10,30,.25); }
.cell.link:active, .acc-open:active { background: rgba(255,255,255,.25); }

const nf = new Intl.NumberFormat('ja-JP');
const yen = n => (n < 0 ? '−¥' : '¥') + nf.format(Math.abs(Math.round(n)));
const sum = arr => arr.reduce((a, b) => a + b, 0);
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー−]/g, '-'); }
function parseAmount(str) { const s = toHalf(str).replace(/[,，\s円¥￥+]/g, ''); return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInput = n => n ? (n < 0 ? '-' : '') + nf.format(Math.abs(n)) : '';
const accountById = id => state.accounts.find(a => a.id === id);

/* =========================================================
   計算：入ってくる − 分ける ＝ のこり
   ========================================================= */
// 口座に入れる額は、設定した単位（初期は1,000円）で繰り上げる
function roundUp(v) { const u = state.roundUnit || 0; return u && v > 0 ? Math.ceil(v / u) * u : v; }
function totals(m) {
  const inc = sum(m.income.map(i => i.amount));
  const out = sum(rowsOf(m).map(r => r.send));
  return { inc, out, rest: inc - out };
}
function rowsOf(m) {
  const rows = state.accounts.map(a => {
    const items = m.out.filter(i => i.acc === a.id);
    const keep = m.income.some(i => i.acc === a.id);
    const total = sum(items.map(i => i.amount));
    const left = (m.left || {})[a.id] || 0;              // 先月から口座に残っている額
    return { a, items, total, left, send: roundUp(Math.max(0, total - left)), verb: a.kind === 'cash' ? '現金でおろす' : keep ? 'に残しておく' : 'に入れる' };
  }).filter(r => r.items.length);
  const lost = m.out.filter(i => !accountById(i.acc));
  if (lost.length) { const total = sum(lost.map(i => i.amount)); rows.push({ a: { id: '', name: '口座が決まっていない', kind: 'none' }, items: lost, total, left: 0, send: total, verb: '' }); }
  return rows;
}

/* =========================================================
   月：なければ前の月をコピーして作る
   ========================================================= */
function latestMonthBefore(mk) { const k = Object.keys(state.months).filter(x => x < mk).sort(); return k.length ? k[k.length - 1] : null; }
// 「毎月入れる」ものだけを、前の月の金額でコピーする（「今月だけ」のものはコピーしない）
function copyMonth(mk, from) {
  const src = state.months[from];
  const cp = arr => arr.filter(i => i.fixed !== false).map(i => ({ ...i, id: uid() }));
  state.months[mk] = src ? { income: cp(src.income), out: cp(src.out), done: {}, left: {} } : { income: [], out: [], done: {}, left: {} };
  save();
}

/* =========================================================
   画面（Apple の Human Interface Guidelines を参考にした作り）
   - まとまりごとの角丸リスト、色付きの角丸アイコン、右に値と「›」
   - 下から出る画面は「キャンセル／完了」付き。下に引っ張ると閉じる
   - 行は左にスワイプで操作（口座は完了、項目は削除）。画面を横にスワイプで月を変える
   ========================================================= */
let viewMonth = monthKey(new Date());
let currentView = 'plan';
const saveBtn = label => '<div class="pad save-pad"><button type="button" class="big-btn" data-save>' + ic('check') + label + '</button></div>';
const tile = (icon, color) => '<span class="tile" style="background:' + color + '">' + ic(icon) + '</span>';
const accTile = a => KIND[a.kind] ? tile(KIND[a.kind].icon, KIND[a.kind].color) : tile('help-fill', 'var(--gray)');
const chev = () => ic('chevron_right', 'chev');

function showView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tabbar button').forEach(b => b.dataset.view === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
$('prevMonth').addEventListener('click', () => changeMonth(-1));
$('nextMonth').addEventListener('click', () => changeMonth(1));
$('todayBtn').addEventListener('click', () => { const d = viewMonth < monthKey(new Date()) ? 1 : -1; viewMonth = monthKey(new Date()); slideIn(d); });
function changeMonth(d) { viewMonth = addMonths(viewMonth, d); slideIn(d); }
function slideIn(d) {
  render();
  const box = $('view-plan');
  box.classList.remove('slide-l', 'slide-r'); void box.offsetWidth;
  box.classList.add(d > 0 ? 'slide-l' : 'slide-r');
}
// 動き終わったら外す（タブを切り替えたときにもう一度動かないように）
$('view-plan').addEventListener('animationend', e => e.currentTarget.classList.remove('slide-l', 'slide-r'));
function render() {
  const plan = currentView === 'plan';
  const [y, mo] = viewMonth.split('-').map(Number);
  $('navTitle').textContent = plan ? y + '年' + mo + '月' : '設定';
  $('monthNav').hidden = !plan;
  $('todayBtn').hidden = !plan || viewMonth === monthKey(new Date());
  (plan ? renderPlan : renderSettings)();
}
// スクロールしたら上の帯に小さい題名を出す（iPhone の大きい題名と同じ動き）
window.addEventListener('scroll', () => $('nav').classList.toggle('scrolled', window.scrollY > 44), { passive: true });

function largeTitle(main, sub) { return '<header class="large-title">' + (sub ? '<div class="lt-sub num">' + sub + '</div>' : '') + '<h1 class="num">' + main + '</h1></header>'; }

/* ---------- 今月 ---------- */
function renderPlan() {
  const box = $('view-plan');
  const [y, mo] = viewMonth.split('-').map(Number);
  const m = state.months[viewMonth];
  let html = largeTitle(mo + '月', y + '年');
  if (!m) {
    const prev = latestMonthBefore(viewMonth);
    html += '<div class="empty-state"><p>' + y + '年' + mo + '月の計画はまだありません</p></div><div class="group">' +
      (prev ? '<button class="cell link" id="mkCopy">' + tile('content_copy', 'var(--blue)') + '<span class="grow"><span class="title">' + monthLabel(prev) + 'から作る</span><span class="sub">「毎月入れる」ものを同じ金額で入れます</span></span>' + chev() + '</button>' : '') +
      '<button class="cell link" id="mkEmpty">' + tile('add', 'var(--gray)') + '<span class="grow"><span class="title">空で作る</span></span>' + chev() + '</button></div>' +
      (Object.keys(state.months).length ? '' : '<div class="group"><button class="cell link" id="mkCode">' + tile('upload', 'var(--indigo)') + '<span class="grow"><span class="title">前のデータを戻す</span><span class="sub">もらったコードを貼り付けます</span></span>' + chev() + '</button></div>');
    box.innerHTML = html;
    if (prev) $('mkCopy').addEventListener('click', () => { copyMonth(viewMonth, prev); render(); });
    $('mkEmpty').addEventListener('click', () => { copyMonth(viewMonth, null); render(); });
    if ($('mkCode')) $('mkCode').addEventListener('click', () => codeRestoreSheet());
    return;
  }
  const t = totals(m);
  const rows = rowsOf(m);
  const doneN = rows.filter(r => r.a.id && m.done[r.a.id]).length;
  const accN = rows.filter(r => r.a.id).length;
  html +=
    '<section class="hero num"><div class="cap">のこり</div><div class="big' + (t.rest < 0 ? ' neg' : '') + '">' + yen(t.rest) + '</div>' +
      (t.rest < 0 ? '<div class="pill neg">' + ic('warning-fill') + yen(-t.rest) + ' たりません</div>' : '<div class="pill ok">' + ic('check_circle-fill') + '足りています</div>') + '</section>' +
    '<div class="group">' +
      '<button class="cell link" id="openIncome">' + tile('south_west', 'var(--green)') + '<span class="grow"><span class="title">入ってくる</span></span><span class="value num">' + yen(t.inc) + '</span>' + chev() + '</button>' +
      '<div class="cell">' + tile('north_east', 'var(--orange)') + '<span class="grow"><span class="title">口座に分ける</span></span><span class="value num">' + yen(t.out) + '</span><span class="chev-space"></span></div>' +
    '</div>' +
    '<div class="group-head"><span>口座に分ける</span><span class="num">' + doneN + ' / ' + accN + ' 完了</span></div>' +
    '<div class="group" id="accList">' + rows.map(r => accRow(m, r)).join('') +
      '<button class="cell link add-cell" id="addOut">' + ic('add_circle-fill', 'add-ic') + '<span class="grow"><span class="title blue">払うものを追加</span></span></button>' +
    '</div>' +
    '<p class="group-foot">分けたら左の丸をタップします（行を左にスワイプしても完了にできます）。口座をタップすると、何を払うかを見て金額を変えられます。</p>' +
    '<div class="group">' +
      '<button class="cell link" id="openLeft">' + tile('savings-fill', 'var(--pink)') + '<span class="grow"><span class="title">先月の余り</span></span><span class="value">' + (rows.some(r => r.left) ? '入力済み' : 'なし') + '</span>' + chev() + '</button>' +
      (latestMonthBefore(viewMonth) ? '<button class="cell link" id="copyPrev">' + tile('content_copy', 'var(--gray)') + '<span class="grow"><span class="title">先月の内容で入れ直す</span></span>' + chev() + '</button>' : '') +
    '</div>';
  box.innerHTML = html;

  $('openIncome').addEventListener('click', () => incomeSheet());
  box.querySelectorAll('[data-done-acc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toggleDone(m, b.dataset.doneAcc); }));
  box.querySelectorAll('.acc-open').forEach(b => b.addEventListener('click', () => accountSheet(b.dataset.acc)));
  box.querySelectorAll('.swipe[data-acc]').forEach(el => enableSwipe(el));
  box.querySelectorAll('[data-swipe-done]').forEach(b => b.addEventListener('click', () => toggleDone(m, b.dataset.swipeDone)));
  $('addOut').addEventListener('click', () => editItem('out', null, '', null));
  $('openLeft').addEventListener('click', () => leftSheet());
  if ($('copyPrev')) $('copyPrev').addEventListener('click', async () => {
    const prev = latestMonthBefore(viewMonth);
    const ok = await ask('先月の内容で入れ直しますか？', monthLabel(prev) + 'の「毎月入れる」ものを同じ金額で入れ直します。「今月だけ」のものは消え、完了の印も外れます。', [{ label: '入れ直す', value: true }]);
    if (ok !== true) return;
    copyMonth(viewMonth, prev); render(); toast('入れ直しました');
  });
}
function toggleDone(m, id) {
  if (m.done[id]) delete m.done[id]; else m.done[id] = true;
  save(); render();
}
function accRow(m, r) {
  const done = !!m.done[r.a.id];
  const sub = (r.verb ? r.verb.replace(/^に/, '') + '｜' : '') + (r.left ? '余り ' + yen(r.left) + ' を引いた額・' : '') + r.items.map(i => i.name).join('・');
  const cell = '<div class="cell acc' + (done ? ' is-done' : '') + '">' +
    (r.a.id ? '<button class="ring" role="checkbox" aria-checked="' + done + '" aria-label="' + esc(r.a.name) + 'に分けた" data-done-acc="' + r.a.id + '">' + ic('check') + '</button>' : '<span class="ring-space"></span>') +
    '<button class="acc-open" data-acc="' + r.a.id + '">' + accTile(r.a) +
      '<span class="grow"><span class="title">' + esc(r.a.name) + '</span><span class="sub">' + esc(sub) + '</span></span>' +
      '<span class="value strong num' + (r.send ? '' : ' zero') + '">' + yen(r.send) + '</span>' + chev() + '</button></div>';
  if (!r.a.id) return cell;
  return '<div class="swipe" data-acc="' + r.a.id + '"><div class="swipe-actions"><button class="sw-btn ' + (done ? 'gray' : 'green') + '" data-swipe-done="' + r.a.id + '">' + ic(done ? 'undo' : 'check') + (done ? '戻す' : '完了') + '</button></div><div class="swipe-content">' + cell + '</div></div>';
}

/* ---------- 項目の行（下から出る画面の中） ---------- */
function itemCell(kind, i, sub) {
  return '<div class="swipe" data-item="' + i.id + '"><div class="swipe-actions"><button class="sw-btn red" data-del="' + i.id + '">' + ic('delete') + '削除</button></div><div class="swipe-content">' +
    '<button class="cell link item" data-edit="' + i.id + '"><span class="grow"><span class="title">' + esc(i.name || '（名前なし）') + (i.fixed === false ? ' <span class="badge">今月だけ</span>' : '') + '</span>' + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="value num' + (i.amount ? '' : ' zero') + '">' + yen(i.amount) + '</span>' + chev() + '</button></div></div>';
}
function bindItemCells(kind, reopen) {
  const body = $('sheetBody');
  body.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => quickEdit(kind, b.dataset.edit, reopen)));
  body.querySelectorAll('.swipe[data-item]').forEach(el => enableSwipe(el));
  body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteItem(kind, b.dataset.del, reopen)));
}
function deleteItem(kind, id, reopen) {
  const m = state.months[viewMonth];
  const idx = m[kind].findIndex(x => x.id === id);
  if (idx < 0) return;
  const [it] = m[kind].splice(idx, 1);
  save(); render(); if (reopen) reopen();
  toast('「' + it.name + '」を削除しました', '取り消す', () => { m[kind].splice(idx, 0, it); save(); render(); if (reopen && $('sheet').classList.contains('open')) reopen(); });
}

/* ---------- 入ってくるお金 ---------- */
function incomeSheet() {
  const m = state.months[viewMonth];
  const t = totals(m);
  openSheet({ title: '入ってくるお金', left: '閉じる', right: ic('add'), rightLabel: '追加',
    body: '<section class="hero small num"><div class="big">' + yen(t.inc) + '</div></section>' +
      '<div class="group">' + (m.income.length ? m.income.map(i => itemCell('income', i, accountById(i.acc) ? accountById(i.acc).name + 'に入る' : '')).join('') : '<div class="cell"><span class="grow sub-only">まだありません</span></div>') + '</div>' +
      '<p class="group-foot">左にスワイプで削除。タップで金額を変えます。</p>',
    onRight: () => editItem('income', null, '', incomeSheet) });
  bindItemCells('income', incomeSheet);
}

/* ---------- 口座の中身 ---------- */
function accountSheet(accId) {
  const m = state.months[viewMonth];
  const r = rowsOf(m).find(x => x.a.id === accId);
  if (!r) { closeSheet(); return; }
  const done = !!m.done[accId];
  const how = r.left || r.send !== r.total ? '払うもの ' + yen(r.total) + (r.left ? ' − 余り ' + yen(r.left) : '') + (r.send !== Math.max(0, r.total - r.left) ? '（' + nf.format(state.roundUnit) + '円単位で繰り上げ）' : '') : '';
  openSheet({ title: r.a.name, left: '閉じる', right: accId ? ic('add') : '', rightLabel: '追加',
    body: '<section class="hero small num">' + accTile(r.a) + '<div class="cap">' + (accId ? r.verb.replace(/^に/, '') : '口座を選んでください') + '</div><div class="big">' + yen(r.send) + '</div>' + (how ? '<div class="cap2">' + how + '</div>' : '') + '</section>' +
      '<div class="group-head"><span>払うもの</span></div><div class="group">' + r.items.map(i => itemCell('out', i, i.memo)).join('') + '</div>' +
      (accId ? '<div class="group-head"><span>先月の余り</span></div><div class="group"><label class="cell form"><span class="label">' + (r.a.kind === 'cash' ? '手元の現金' : '口座に残っている額') + '</span><input class="num" type="text" inputmode="numeric" id="sLeft" value="' + fmtInput(r.left) + '" placeholder="0"><span class="unit">円</span></label></div>' +
        '<p class="group-foot">入れると、その分だけ入れる額が減ります。</p>' +
        '<div class="pad"><button class="big-btn' + (done ? ' done' : '') + '" id="sDone">' + ic('check') + (done ? '分けました' : '分けたら押す') + '</button></div>' : ''),
    onRight: accId ? () => editItem('out', null, accId, () => accountSheet(accId)) : null });
  bindItemCells('out', () => accountSheet(accId));
  if (accId) {
    amountInput($('sLeft'));
    $('sLeft').addEventListener('change', () => { setLeft(m, accId, $('sLeft').value); save(); render(); accountSheet(accId); });
    $('sDone').addEventListener('click', () => { toggleDone(m, accId); if (m.done[accId]) closeSheet(); else accountSheet(accId); });
  }
}

/* ---------- 先月の余り ---------- */
function setLeft(m, accId, raw) {
  const n = String(raw).trim() === '' ? 0 : parseAmount(raw);
  m.left = m.left || {};
  if (Number.isFinite(n) && n > 0) m.left[accId] = n; else delete m.left[accId];
}
function leftSheet() {
  const m = state.months[viewMonth];
  const rows = rowsOf(m).filter(r => r.a.id);
  const pm = state.months[latestMonthBefore(viewMonth)];
  const prevRows = pm ? rowsOf(pm) : [];
  openSheet({ title: '先月の余り', left: 'キャンセル', right: '保存',
    body: '<p class="sheet-lead">口座に残っているお金を入れると、その分だけ入れる額が減ります。</p><div class="group">' + rows.map(r => {
      const pr = prevRows.find(x => x.a.id === r.a.id);
      const extra = pr ? pr.send - Math.max(0, pr.total - pr.left) : 0;
      return '<label class="cell form icon">' + accTile(r.a) + '<span class="label">' + esc(r.a.name) + (extra > 0 ? '<small>先月の繰り上げ分 ' + yen(extra) + '</small>' : '') + '</span><input class="num" type="text" inputmode="numeric" data-left="' + r.a.id + '" value="' + fmtInput(r.left) + '" placeholder="0"><span class="unit">円</span></label>';
    }).join('') + '</div>' + saveBtn('保存'),
    onRight: () => { $('sheetBody').querySelectorAll('[data-left]').forEach(inp => setLeft(m, inp.dataset.left, inp.value)); save(); closeSheet(); render(); toast('余りを入れました'); } });
  $('sheetBody').querySelectorAll('[data-left]').forEach(amountInput);
}

/* ---------- 金額だけ変える ---------- */
function quickEdit(kind, id, back) {
  const m = state.months[viewMonth];
  const it = m[kind].find(x => x.id === id);
  if (!it) return back ? back() : closeSheet();
  const pm = state.months[addMonths(viewMonth, -1)];
  const prev = pm ? (pm[kind].find(x => x.name === it.name && x.acc === it.acc) || pm[kind].find(x => x.name === it.name)) : null;
  const where = [accountById(it.acc) ? accountById(it.acc).name : '口座が決まっていません', it.memo].filter(Boolean).join('・');
  const done = () => {
    const n = $('qAmount').value.trim() === '' ? 0 : parseAmount($('qAmount').value);
    if (!Number.isFinite(n)) { toast('数字で入れてください'); return; }
    it.amount = n; save(); render(); back ? back() : closeSheet(); toast('保存しました');
  };
  openSheet({ title: it.name || '（名前なし）', left: 'キャンセル', right: '保存', onLeft: back,
    body: '<p class="sheet-lead center">' + esc(where) + '</p>' +
      '<form id="qForm" class="amount-big num" autocomplete="off"><span class="yen">¥</span><input type="text" inputmode="numeric" id="qAmount" value="' + fmtInput(it.amount) + '" placeholder="0" aria-label="金額"></form>' +
      '<div class="chips">' + (prev && prev.amount !== it.amount ? '<button type="button" class="chip num" data-q="' + prev.amount + '">先月と同じ ' + yen(prev.amount) + '</button>' : '') + '<button type="button" class="chip" data-q="0">0円にする</button></div>' + saveBtn('保存') +
      '<div class="group">' +
        '<label class="cell"><span class="grow"><span class="title">毎月入れる</span><span class="sub">オフにすると今月だけ（来月にはコピーされません）</span></span><input type="checkbox" class="switch" id="qFixed"' + (it.fixed === false ? '' : ' checked') + '></label>' +
        '<button class="cell link" id="qMore"><span class="grow"><span class="title">名前・口座・メモを変える</span></span>' + chev() + '</button>' +
      '</div>' +
      '<div class="group"><button class="cell link center-cell" id="qDel"><span class="title red">この項目を削除</span></button></div>',
    onRight: done });
  const inp = $('qAmount');
  amountInput(inp);
  // 入力欄の幅を数字の実際の幅に合わせて「¥」とくっつける
  const ruler = document.createElement('span');
  const cs = getComputedStyle(inp);
  ruler.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre';
  Object.assign(ruler.style, { fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight, letterSpacing: cs.letterSpacing, fontVariantNumeric: cs.fontVariantNumeric });
  document.body.appendChild(ruler);
  const fit = () => { ruler.textContent = inp.value || inp.placeholder; inp.style.width = (ruler.offsetWidth + 6) + 'px'; };
  document.fonts.ready.then(fit);
  setTimeout(() => ruler.remove(), 60000);
  inp.addEventListener('input', fit); fit();
  $('qForm').addEventListener('submit', e => { e.preventDefault(); done(); });
  $('sheetBody').querySelectorAll('[data-q]').forEach(c => c.addEventListener('click', () => { inp.value = fmtInput(+c.dataset.q); fit(); }));
  $('qFixed').addEventListener('change', e => { it.fixed = e.target.checked; save(); });
  $('qMore').addEventListener('click', () => editItem(kind, id, it.acc, () => quickEdit(kind, id, back)));
  $('qDel').addEventListener('click', () => deleteItem(kind, id, back || closeSheet));
}

/* ---------- 追加・名前や口座の変更 ---------- */
function editItem(kind, id, presetAcc, back) {
  const m = state.months[viewMonth];
  const it = id ? m[kind].find(x => x.id === id) : null;
  const v = it || { name: '', acc: presetAcc || '', amount: 0, memo: '', fixed: true };
  const names = new Set();
  for (const mm of Object.values(state.months)) for (const i of mm[kind]) names.add(i.name);
  $('dlNames').innerHTML = [...names].map(n => '<option value="' + esc(n) + '">').join('');
  const accOpts = '<option value="">決めない</option>' + state.accounts.map(a => '<option value="' + a.id + '"' + (a.id === v.acc ? ' selected' : '') + '>' + esc(a.name) + '</option>').join('');
  const saveIt = () => {
    const name = $('iName').value.trim();
    const n = $('iAmount').value.trim() === '' ? 0 : parseAmount($('iAmount').value);
    if (!name) { toast('なまえを入れてください'); $('iName').focus(); return; }
    if (!Number.isFinite(n)) { toast('金額は数字で入れてください'); return; }
    const rec = { name, amount: n, acc: $('iAcc').value, memo: $('iMemo').value.trim(), fixed: $('iFixed').checked };
    if (it) Object.assign(it, rec); else m[kind].push({ id: uid(), ...rec });
    save(); render(); toast(it ? '保存しました' : '追加しました');

/* ---------- コードでデータを移す（ファイルを使わずに戻せるように） ---------- */
const CODE_PREFIX = 'KAKEIBO1:';
async function encodeCode(obj) {
  const bytes = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return CODE_PREFIX + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function decodeCode(text) {
  const t = String(text).trim();
  if (t.startsWith('{')) return JSON.parse(t);
  let b = t.replace(/^KAKEIBO1[:：]/, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
}
function codeRestoreSheet() {
  openSheet({ title: 'コードで戻す', left: 'キャンセル', right: '戻す',
    body: '<p class="sheet-lead">もらったコード（KAKEIBO1: で始まる文字）をコピーして、下に貼り付けてください。</p>' +
      '<div class="group"><textarea id="codeBox" class="code-box" rows="7" placeholder="ここに貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>' +
      '<p class="group-foot">今の内容は、コードの内容に置き換わります。</p>' + saveBtn('戻す'),
    onRight: async () => {
      let obj;
      try { obj = await decodeCode($('codeBox').value); } catch (e) { toast('コードを読めませんでした。最後までコピーできているか確かめてください'); return; }
      const next = normalizeState(obj);
      if (!Object.keys(next.months).length) { toast('このコードにはデータがありません'); return; }
      if (!await confirmDanger('このデータに置き換えますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を戻します。今の内容は置き換わります。', '戻す')) return;
      state = next; save(); closeSheet();
      const cur = monthKey(new Date());
      if (!state.months[cur] && latestMonthBefore(cur)) copyMonth(cur, latestMonthBefore(cur));
      viewMonth = cur; showView('plan'); toast('データを戻しました');
    } });
}

/* =========================================================
   スワイプ（行を左に動かすと操作ボタンが出る。大きく動かすとそのまま実行）
   ========================================================= */
let openSwipe = null;
function enableSwipe(el) {
  const content = el.querySelector('.swipe-content');
  const actions = el.querySelector('.swipe-actions');
  let sx = 0, sy = 0, dx = 0, base = 0, active = false, decided = false, horizontal = false;
  const set = (x, anim) => { content.style.transition = anim ? 'transform .25s cubic-bezier(.2,.8,.2,1)' : 'none'; content.style.transform = 'translateX(' + x + 'px)'; };
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (openSwipe && openSwipe !== el) openSwipe.close();
    sx = e.clientX; sy = e.clientY; dx = 0; active = true; decided = false; horizontal = false;
    base = el.classList.contains('open') ? -actions.offsetWidth : 0;
  });
  el.addEventListener('pointermove', e => {
    if (!active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { decided = true; horizontal = Math.abs(mx) > Math.abs(my); if (horizontal) { el.setPointerCapture(e.pointerId); el.classList.add('moving'); } }
    if (!horizontal) return;
    e.preventDefault();
    dx = Math.min(0, base + mx);
    set(dx, false);
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (!horizontal) return;
    el.dataset.swiped = '1'; setTimeout(() => delete el.dataset.swiped, 50);
    const w = actions.offsetWidth;
    if (-dx > el.offsetWidth * 0.55) { set(-el.offsetWidth, true); setTimeout(() => actions.querySelector('button').click(), 180); return; }
    if (-dx > w / 2) { set(-w, true); el.classList.add('open'); openSwipe = el; } else el.close();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if (el.dataset.swiped) { e.stopPropagation(); e.preventDefault(); } }, true);
  el.close = () => { set(0, true); el.classList.remove('open'); setTimeout(() => { if (!el.classList.contains('open')) el.classList.remove('moving'); }, 260); if (openSwipe === el) openSwipe = null; };
}
document.addEventListener('pointerdown', e => { if (openSwipe && !openSwipe.contains(e.target)) openSwipe.close(); });

   バックアップ・CSV
   ========================================================= */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s) && !/^-?\d+$/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const HEAD = ['月', '種類', 'なまえ', '口座', '金額', 'メモ'];
function toCSV() {
  const lines = [HEAD.join(',')];
  for (const mk of Object.keys(state.months).sort()) {
    const m = state.months[mk];
    for (const [kind, label] of [['income', '入ってくる'], ['out', '払う']]) for (const i of m[kind]) lines.push([mk, label, i.name, accountById(i.acc) ? accountById(i.acc).name : '', i.amount, i.memo].map(csvCell).join(','));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
$('fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let obj; try { obj = JSON.parse(await f.text()); } catch (err) { toast('ファイルを読めませんでした'); return; }
  const next = normalizeState(obj);
  if (!await confirmDanger('バックアップから戻しますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を戻します。今の内容は置き換わります。', '戻す')) return;
  state = next; save(); toast('戻しました'); showView('plan');
});
$('fileCsv').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let text = await f.text();
  if (text.includes('�')) { try { text = new TextDecoder('shift_jis').decode(await f.arrayBuffer()); } catch (err) { /* ignore */ } }
  const rows = parseCSV(text);
  const head = (rows[0] || []).map(h => h.trim());
  const c = n => head.indexOf(n);
  if (c('月') < 0 || c('種類') < 0 || c('なまえ') < 0) { await ask('読み込めませんでした', '1行目は「' + HEAD.join(',') + '」にしてください。', [{ label: 'OK', value: true }]); return; }
  const byMonth = {};
  for (const r of rows.slice(1)) {
    const mm = toHalf(r[c('月')] || '').trim().match(/^(\d{4})[-\/.年](\d{1,2})/);
    if (!mm) continue;
    const mk = mm[1] + '-' + pad(+mm[2]);
    const kind = (r[c('種類')] || '').includes('入') ? 'income' : 'out';
    const accName = (c('口座') >= 0 ? r[c('口座')] : '').trim();
    let acc = accName ? state.accounts.find(a => a.name === accName) : null;
    if (accName && !acc) { acc = { id: 'a_' + uid(), name: accName, kind: accName === '手持ち' ? 'cash' : 'bank' }; state.accounts.push(acc); }
    const amt = c('金額') >= 0 ? parseAmount(r[c('金額')] || '0') : 0;
    (byMonth[mk] = byMonth[mk] || { income: [], out: [], done: {} })[kind].push({ id: uid(), name: (r[c('なまえ')] || '').trim().replace(/^'(?=[=+\-@])/, ''), acc: acc ? acc.id : '', amount: Number.isFinite(amt) ? amt : 0, memo: c('メモ') >= 0 ? (r[c('メモ')] || '').trim() : '' });
  }
  const ks = Object.keys(byMonth).sort();
  if (!ks.length) { toast('読み込める行がありませんでした'); return; }
  if (!await confirmDanger(ks.length + 'か月分を読み込みますか？', monthLabel(ks[0]) + '〜' + monthLabel(ks[ks.length - 1]) + '。同じ月があれば置き換わります。', '読み込む')) return;
  for (const k of ks) state.months[k] = byMonth[k];
  save(); toast('読み込みました'); render();
});

}
$('sheetLeft').addEventListener('click', () => { if (sheetLeft) sheetLeft(); else closeSheet(); });
$('sheetRight').addEventListener('click', () => { if (sheetRight) sheetRight(); });
$('sheetBack').addEventListener('click', () => closeSheet());
// 上の部分（つまみ・題名）を下に引っ張ると閉じる
(() => {
  const sheet = $('sheet'), grip = $('sheetGrip');
  let sy = 0, dy = 0, on = false;
  grip.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; on = true; sy = e.clientY; dy = 0; grip.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  grip.addEventListener('pointermove', e => { if (!on) return; dy = Math.max(0, e.clientY - sy); sheet.style.transform = 'translateY(' + dy + 'px)'; });
  const end = () => { if (!on) return; on = false; sheet.style.transition = ''; if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
})();

// 確認：画面の下から出るボタンの並び（iPhone のアクションシート）
let askResolve = null;
function ask(title, text, buttons) {
  return new Promise(resolve => {
    if (askResolve) askResolve(undefined);
    askResolve = resolve;
    const box = $('actionBox');
    box.innerHTML = '<div class="as-group"><div class="as-msg"><b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</div>' +
      buttons.map((b, i) => '<button class="as-btn' + (b.danger ? ' red' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div>' +
      '<div class="as-group"><button class="as-btn bold" data-cancel>キャンセル</button></div>';
    const done = v => { $('actionBack').classList.remove('open'); const r = askResolve; askResolve = null; if (r) r(v); };
    box.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => done(buttons[+b.dataset.i].value)));
    box.querySelector('[data-cancel]').addEventListener('click', () => done(undefined));
    $('actionBack').onclick = e => { if (e.target === $('actionBack')) done(undefined); };
    $('actionBack').classList.add('open');
  });
}
function confirmDanger(title, text, label) {
  return ask(title, text, [{ label: label || '削除', value: true, danger: true }]).then(v => v === true);
}

function amountInput(inp) {
  inp.addEventListener('input', () => {
    const d = toHalf(inp.value).replace(/[^\d]/g, '');
    inp.value = d ? nf.format(parseInt(d, 10)) : '';
  });
}
let toastTimer, toastFn = null;
function toast(msg, actionLabel, fn) {
  const t = $('toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button id="toastAct">' + esc(actionLabel) + '</button>' : '');
  toastFn = fn || null;
  if (actionLabel) $('toastAct').addEventListener('click', () => { const f = toastFn; toastFn = null; t.classList.remove('show'); if (f) f(); });
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastFn = null; }, actionLabel ? 4500 : 2200);
}

})();
save();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
