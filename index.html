<!-- フォント：Google Fonts。文字は Noto Sans JP（Medium 500・Bold 700）、数字は Barlow（DIN 2014 は Google Fonts にないため、DIN に近い Barlow を数字と記号だけ読み込む） -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --muted: #6f6d68;
  --border: rgba(11,11,11,0.10); --grid: #e1e0d9; --axis: #c3c2b7;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --critical-text: #b42828; --good-text: #006300; --check: #2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a988f;
    --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --accent-ink: #ffffff;
    --critical-text: #f08585; --good-text: #3fc23f; --check: #3987e5; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #9a988f;
  --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --accent-ink: #ffffff;
  --critical-text: #f08585; --good-text: #3fc23f; --check: #3987e5; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--text);
  font-family: "Barlow", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  font-weight: 500;
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  min-height: 100vh; padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

.app-header { position: sticky; top: 0; z-index: 10; background: var(--page); padding: calc(6px + env(safe-area-inset-top)) 16px 6px; border-bottom: 1px solid var(--border); }
.month-nav { display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; }
.month-nav h1 { margin: 0; }
.month-nav h1 button { background: none; border: 0; padding: 4px 8px; font-weight: 700; font-size: 18px; border-radius: 8px; }
.month-nav h1 button:disabled { color: var(--text); opacity: 1; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; font-size: 26px; color: var(--text-2); }
.icon-btn:active { background: var(--surface-2); }

main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
.view { display: none; }
.view.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 8px 0; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0; }

/* 上の3つの数字 */
.sum-row { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; background: none; border: 0; padding: 12px 0; text-align: left; font-size: 17px; }
.sum-row + .sum-row { border-top: 1px solid var(--grid); }
.sum-row b { font-size: 22px; white-space: nowrap; }
.sum-row .go { color: var(--muted); margin-left: 6px; font-weight: 500; }
.sum-row.rest { border-top: 2px solid var(--text) !important; font-weight: 700; }
.sum-row.rest b { font-size: 30px; }
.neg { color: var(--critical-text); }
.sum-hint { font-size: 13px; font-weight: 700; display: block; text-align: right; margin: -6px 0 6px; }

/* 口座の一覧 */
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--grid); }
.acc { display: flex; align-items: center; gap: 4px; min-height: 64px; }
.check { flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; margin-left: -10px; }
.check i { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--axis); display: flex; align-items: center; justify-content: center; font-style: normal; }
.check[aria-checked="true"] i { background: var(--check); border-color: var(--check); color: #fff; }
.row-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 10px 0; text-align: left; min-height: 56px; }
.row-btn .t { flex: 1; min-width: 0; }
.row-btn .n { font-size: 16px; font-weight: 700; }
.row-btn .n .verb { font-weight: 500; font-size: 14px; color: var(--text-2); margin-left: 4px; white-space: nowrap; display: inline-block; }
.row-btn .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-btn .a { font-size: 18px; font-weight: 700; white-space: nowrap; }
.row-btn .a.zero { color: var(--muted); font-weight: 500; }
.row-btn .go { color: var(--muted); font-size: 20px; }
.acc[data-done="true"] .a { color: var(--muted); text-decoration: line-through; }
.item-btn { width: 100%; }
.ms { width: 1.25em; height: 1.25em; fill: currentColor; flex: none; vertical-align: -0.28em; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; }
.icon-btn .ms { width: 28px; height: 28px; }
.tabbar button .ms { width: 26px; height: 26px; }
.tabbar button .ms.on, .tabbar button[aria-current="page"] .ms:not(.on) { display: none; }
.tabbar button[aria-current="page"] .ms.on { display: block; }
.acc-ic { width: 32px; height: 32px; border-radius: 16px; background: var(--surface-2); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-right: 2px; vertical-align: middle; flex: none; }
.acc-ic .ms { width: 20px; height: 20px; vertical-align: 0; }
.check i .ms { width: 18px; height: 18px; fill: transparent; vertical-align: 0; }
.check[aria-checked="true"] i .ms { fill: #fff; }
.add { display: flex; align-items: center; gap: 8px; }
.add .ms, .btn .ms { width: 22px; height: 22px; vertical-align: 0; }
.btn { gap: 6px; }
.sum-row .go.ms { width: 22px; height: 22px; fill: var(--muted); margin-left: 2px; vertical-align: -0.15em; }
.row-btn .go.ms { width: 22px; height: 22px; fill: var(--muted); }
.sum-hint .ms { width: 18px; height: 18px; vertical-align: -0.2em; }
.lbl-ic { display: flex !important; align-items: center; gap: 6px; }
.lbl-ic .ms { width: 20px; height: 20px; fill: var(--accent); }
.left-tag { color: var(--good-text); font-weight: 700; margin-right: 6px; }
.left-field { margin-top: 14px; }
.hint { color: var(--muted); font-size: 12px; }
.big-amount.small input { font-size: 22px; min-height: 46px; }
.once { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 15px; margin-bottom: 10px; }
.check-row input { width: 22px; height: 22px; accent-color: var(--check); margin: 0; }
.item-btn .n { font-weight: 500; }
.add { width: 100%; background: none; border: 0; border-top: 1px solid var(--grid); color: var(--accent); font-weight: 700; padding: 12px 0; text-align: left; font-size: 15px; min-height: 48px; }
.list + .add { border-top: 1px solid var(--grid); }

/* 下から出る画面 */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
.modal-back.open { display: flex; }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.modal .sub { margin: 0 0 12px; color: var(--text-2); font-size: 14px; white-space: pre-line; }
.modal p { margin: 0 0 14px; color: var(--text-2); font-size: 14px; white-space: pre-line; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
input[type="text"], select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background-color: var(--surface); font-size: 16px; min-height: 46px; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.big-amount { position: relative; }
.big-amount input { font-size: 30px; font-weight: 700; padding-right: 44px; text-align: right; }
.big-amount .yen { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); padding: 10px 16px; font-weight: 700; min-height: 48px; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--critical-text); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; width: auto; }
.btn.done-on { background: var(--check); color: #fff; border-color: var(--check); }
.btn:disabled { opacity: 0.4; }
.btn-col { display: grid; gap: 8px; }
.set-list { list-style: none; margin: 0 0 12px; padding: 0; }
.set-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.set-list .grow { flex: 1; min-width: 0; }
.set-list .sub { font-size: 12px; color: var(--muted); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: grid; grid-template-columns: 1fr 1fr; max-width: 560px; margin: 0 auto; padding: 0; list-style: none; }
.tabbar button { width: 100%; height: 58px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--page); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
</style>
</head>

<script>
'use strict';
/* =========================================================
   データ
   - accounts: 口座（銀行口座 bank ／ 現金 cash）
   - months['2026-11']: { income: [...], out: [...], done: { 口座id: true } }
   - 項目: { id, name, acc, amount, memo }
   ========================================================= */
const STORAGE_KEY = 'kakeibo.v2';

const ic = (name, cls) => '<svg class="ms' + (cls ? ' ' + cls : '') + '" viewBox="0 -960 960 960" aria-hidden="true"><path d="' + ICONS[name] + '"/></svg>';
const KIND = { bank: { label: '銀行口座', icon: 'account_balance' }, cash: { label: '現金（手持ち）', icon: 'payments' } };

function defaultState() {
  return { version: 4, accounts: [{ id: 'a_cash', name: '手持ち', kind: 'cash' }], months: {}, roundUnit: 1000 };
}
let state = loadState();
let storageOk = true;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeState(JSON.parse(raw));
  } catch (e) { console.warn(e); }
  return defaultState();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; toast('保存できませんでした'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const int = v => Number.isFinite(+v) ? Math.round(+v) : 0;

function normalizeState(s) {
  if (s && s.data && s.app === 'kakeibo') s = s.data;
  if (!s || typeof s !== 'object') return defaultState();
  if (s.version === 4) {
    const accounts = (Array.isArray(s.accounts) ? s.accounts : []).filter(a => a && a.id && a.name).map(a => ({ id: String(a.id), name: String(a.name), kind: a.kind === 'cash' ? 'cash' : 'bank' }));
    const months = {};
    for (const [mk, m] of Object.entries(s.months || {})) {
      if (!/^\d{4}-\d{2}$/.test(mk) || !m) continue;
      const clean = arr => (Array.isArray(arr) ? arr : []).filter(i => i && i.name !== undefined).map(i => ({ id: String(i.id || uid()), name: String(i.name), acc: String(i.acc || ''), amount: int(i.amount), memo: String(i.memo || ''), fixed: i.fixed !== false }));
      months[mk] = { income: clean(m.income), out: clean(m.out), done: Object.fromEntries(Object.entries(m.done || {}).filter(([, v]) => v).map(([k]) => [k, true])), left: Object.fromEntries(Object.entries(m.left || {}).map(([k, v]) => [k, int(v)]).filter(([, v]) => v > 0)) };
    }
    return { version: 4, accounts, months, roundUnit: [0, 100, 1000, 10000].includes(s.roundUnit) ? s.roundUnit : 1000 };
  }
  return fromOldVersion(s);
}

// 前の版（区分・名義・支払い方法・カードがあった形）からの変換
function fromOldVersion(s) {
  const out = defaultState();
  out.accounts = [];
  const raw = Array.isArray(s.accounts) ? s.accounts.filter(a => a && a.id && a.name) : [];
  const cards = {};
  const dupName = n => raw.filter(a => a.name === n && a.kind !== 'card').length > 1;
  for (const a of raw) {
    if (a.kind === 'card') { cards[a.id] = a; continue; }
    const owner = a.owner && a.owner !== 'ー' ? a.owner : '';
    out.accounts.push({ id: String(a.id), name: dupName(a.name) && owner ? a.name + '（' + owner + '）' : String(a.name), kind: a.kind === 'cash' ? 'cash' : 'bank' });
  }
  const via = {};   // 旧「支払い方法」→ 口座
  if (Array.isArray(s.methods)) {
    for (const me of s.methods) {
      if (!me || !me.id) continue;
      if (me.cash) {
        let c = out.accounts.find(a => a.kind === 'cash');
        if (!c) { c = { id: 'a_cash', name: '手持ち', kind: 'cash' }; out.accounts.push(c); }
        via[me.id] = c.id;
      } else via[me.id] = me.accountId || '';
    }
  }
  if (!out.accounts.some(a => a.kind === 'cash')) out.accounts.push({ id: 'a_cash', name: '手持ち', kind: 'cash' });
  for (const [mk, m] of Object.entries(s.months || {})) {
    if (!/^\d{4}-\d{2}$/.test(mk) || !m) continue;
    const nm = { income: [], out: [], done: {} };
    const label = (i, list) => {
      const owner = i.owner && i.owner !== 'ー' ? i.owner : '';
      return owner && list.filter(x => x.name === i.name).length > 1 && !i.name.startsWith(owner) ? owner + i.name : String(i.name);
    };
    const inc = Array.isArray(m.income) ? m.income : [];
    for (const i of inc) nm.income.push({ id: String(i.id || uid()), name: label(i, inc), acc: String(i.via || ''), amount: int(i.amount), memo: String(i.memo || ''), fixed: true });
    const outs = ['fixed', 'variable', 'saving'].flatMap(k => Array.isArray(m[k]) ? m[k] : []);
    const byCard = {};
    for (const i of outs) {
      let acc = String(via[i.via] !== undefined ? via[i.via] : (i.via || ''));
      if (cards[acc]) { (byCard[acc] = byCard[acc] || []).push(i); continue; }
      nm.out.push({ id: String(i.id || uid()), name: label(i, outs), acc, amount: int(i.amount), memo: String(i.memo || ''), fixed: true });
    }
    // カードは「引き落とし口座から払う1行（請求額）」にまとめる
    for (const [cid, items] of Object.entries(byCard)) {
      const card = cards[cid];
      const bill = items.find(i => i.bill);
      const bd = items.filter(i => !i.bill);
      if (bill) {
        const inside = bd.length ? bd.map(i => i.name + ' ' + int(i.amount).toLocaleString('ja-JP')).join('・') + ' を含む' : '';
        nm.out.push({ id: String(bill.id || uid()), name: String(card.name), acc: String(card.payFrom || ''), amount: int(bill.amount), memo: [inside, bill.memo].filter(Boolean).join('／'), fixed: true });
      } else for (const i of bd) nm.out.push({ id: String(i.id || uid()), name: String(i.name), acc: String(card.payFrom || ''), amount: int(i.amount), memo: [card.name + '払い', i.memo].filter(Boolean).join('・'), fixed: true });
    }
    for (const [aid, mv] of Object.entries(m.moves || {})) if (mv && mv.done) nm.done[aid] = true;
    out.months[mk] = nm;
  }
  return out;
}

/* =========================================================
   小さな道具
   ========================================================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const dateKey = d => monthKey(d) + '-' + pad(d.getDate());
function addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function monthLabel(mk) { const [y, m] = mk.split('-').map(Number); return y + '年' + m + '月'; }
const nf = new Intl.NumberFormat('ja-JP');
const yen = n => (n < 0 ? '−¥' : '¥') + nf.format(Math.abs(Math.round(n)));
const sum = arr => arr.reduce((a, b) => a + b, 0);
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー−]/g, '-'); }
function parseAmount(str) { const s = toHalf(str).replace(/[,，\s円¥￥+]/g, ''); return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInput = n => n ? (n < 0 ? '-' : '') + nf.format(Math.abs(n)) : '';
const accountById = id => state.accounts.find(a => a.id === id);

/* =========================================================
   計算：入ってくる − 分ける ＝ のこり
   ========================================================= */
// 口座に入れる額は、設定した単位（初期は1,000円）で繰り上げる
function roundUp(v) { const u = state.roundUnit || 0; return u && v > 0 ? Math.ceil(v / u) * u : v; }
function totals(m) {
  const inc = sum(m.income.map(i => i.amount));
  const out = sum(rowsOf(m).map(r => r.send));
  return { inc, out, rest: inc - out };
}
function rowsOf(m) {
  const rows = state.accounts.map(a => {
    const items = m.out.filter(i => i.acc === a.id);
    const keep = m.income.some(i => i.acc === a.id);
    const total = sum(items.map(i => i.amount));
    const left = (m.left || {})[a.id] || 0;              // 先月から口座に残っている額
    return { a, items, total, left, send: roundUp(Math.max(0, total - left)), verb: a.kind === 'cash' ? '現金でおろす' : keep ? 'に残しておく' : 'に入れる' };
  }).filter(r => r.items.length);
  const lost = m.out.filter(i => !accountById(i.acc));
  if (lost.length) { const total = sum(lost.map(i => i.amount)); rows.push({ a: { id: '', name: '口座が決まっていない', kind: 'none' }, items: lost, total, left: 0, send: total, verb: '' }); }
  return rows;
}

/* =========================================================
   月：なければ前の月をコピーして作る
   ========================================================= */
function latestMonthBefore(mk) { const k = Object.keys(state.months).filter(x => x < mk).sort(); return k.length ? k[k.length - 1] : null; }
// 「毎月入れる」ものだけを、前の月の金額でコピーする（「今月だけ」のものはコピーしない）
function copyMonth(mk, from) {
  const src = state.months[from];
  const cp = arr => arr.filter(i => i.fixed !== false).map(i => ({ ...i, id: uid() }));
  state.months[mk] = src ? { income: cp(src.income), out: cp(src.out), done: {}, left: {} } : { income: [], out: [], done: {}, left: {} };
  save();
}

/* =========================================================
   画面
   ========================================================= */
let viewMonth = monthKey(new Date());
let currentView = 'plan';
function showView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tabbar button').forEach(b => b.dataset.view === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
$('prevMonth').addEventListener('click', () => { viewMonth = addMonths(viewMonth, -1); render(); });
$('nextMonth').addEventListener('click', () => { viewMonth = addMonths(viewMonth, 1); render(); });
$('monthLabel').addEventListener('click', () => { viewMonth = monthKey(new Date()); render(); });
function render() {
  const nav = currentView === 'plan';
  $('prevMonth').style.visibility = $('nextMonth').style.visibility = nav ? 'visible' : 'hidden';
  $('monthLabel').disabled = !nav;
  $('monthLabel').textContent = nav ? monthLabel(viewMonth) : '設定';
  (nav ? renderPlan : renderSettings)();
}

function renderPlan() {
  const box = $('view-plan');
  const m = state.months[viewMonth];
  if (!m) {
    const prev = latestMonthBefore(viewMonth);
    box.innerHTML = '<div class="card"><h2>' + monthLabel(viewMonth) + 'はまだありません</h2><div class="btn-col" style="margin:8px 0">' +
      (prev ? '<button class="btn primary" id="mkCopy">' + monthLabel(prev) + 'の「毎月入れる」もので作る</button>' : '') +
      '<button class="btn' + (prev ? '' : ' primary') + '" id="mkEmpty">空で作る</button></div></div>';
    if (prev) $('mkCopy').addEventListener('click', () => { copyMonth(viewMonth, prev); render(); });
    $('mkEmpty').addEventListener('click', () => { copyMonth(viewMonth, null); render(); });
    return;
  }
  const t = totals(m);
  const rows = rowsOf(m);
  box.innerHTML =
    '<div class="card num">' +
      '<button class="sum-row" id="openIncome"><span>入ってくる</span><b>' + yen(t.inc) + ic('chevron_right', 'go') + '</b></button>' +
      '<div class="sum-row"><span>分ける</span><b>' + yen(t.out) + '</b></div>' +
      '<div class="sum-row rest"><span>のこり</span><b class="' + (t.rest < 0 ? 'neg' : '') + '">' + yen(t.rest) + '</b></div>' +
      (t.rest < 0 ? '<span class="sum-hint neg">' + ic('warning') + ' ' + yen(-t.rest) + ' たりません</span>' : '') +
    '</div>' +
    '<div class="card"><ul class="list">' + rows.map(r => {
      const done = !!m.done[r.a.id];
      const icon = '<span class="acc-ic">' + ic(KIND[r.a.kind] ? KIND[r.a.kind].icon : 'help') + '</span>';
      return '<li class="acc" data-done="' + done + '">' +
        (r.a.id ? '<button class="check" role="checkbox" aria-checked="' + done + '" aria-label="' + esc(r.a.name) + 'に分けた" data-done-acc="' + r.a.id + '"><i>' + ic('check') + '</i></button>' : '<span class="check"></span>') +
        '<button class="row-btn" data-acc="' + r.a.id + '">' + icon + '<span class="t"><div class="n">' + esc(r.a.name) + '<span class="verb">' + r.verb + '</span></div>' +
        '<div class="s">' + (r.left ? '<span class="left-tag">余り ' + yen(r.left) + ' を引いた額</span>' : '') + esc(r.items.map(i => i.name).join('・')) + '</div></span>' +
        '<span class="a num' + (r.send ? '' : ' zero') + '">' + yen(r.send) + '</span>' + ic('chevron_right', 'go') + '</button></li>';
    }).join('') + '</ul><button class="add" id="addOut">' + ic('add') + '払うものを追加</button><button class="add" id="openLeft">' + ic('savings') + '先月の余りを入れる' + (rows.some(r => r.left) ? '（入力済み）' : '') + '</button></div>' +
    (latestMonthBefore(viewMonth) ? '<button class="btn" id="copyPrev">' + ic('content_copy') + '先月の「毎月入れる」ものを入れ直す</button>' : '');

  $('openIncome').addEventListener('click', () => incomeSheet());

/* =========================================================
   バックアップ・CSV
   ========================================================= */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s) && !/^-?\d+$/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const HEAD = ['月', '種類', 'なまえ', '口座', '金額', 'メモ'];
function toCSV() {
  const lines = [HEAD.join(',')];
  for (const mk of Object.keys(state.months).sort()) {
    const m = state.months[mk];
    for (const [kind, label] of [['income', '入ってくる'], ['out', '払う']]) for (const i of m[kind]) lines.push([mk, label, i.name, accountById(i.acc) ? accountById(i.acc).name : '', i.amount, i.memo].map(csvCell).join(','));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
$('fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let obj; try { obj = JSON.parse(await f.text()); } catch (err) { toast('ファイルを読めませんでした'); return; }
  const next = normalizeState(obj);
  if (!await confirmDanger('バックアップから戻しますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を戻します。今の内容は置き換わります。', '戻す')) return;
  state = next; save(); toast('戻しました'); showView('plan');
});
$('fileCsv').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let text = await f.text();
  if (text.includes('�')) { try { text = new TextDecoder('shift_jis').decode(await f.arrayBuffer()); } catch (err) { /* ignore */ } }
  const rows = parseCSV(text);
  const head = (rows[0] || []).map(h => h.trim());
  const c = n => head.indexOf(n);
  if (c('月') < 0 || c('種類') < 0 || c('なまえ') < 0) { await ask('読み込めませんでした', '1行目は「' + HEAD.join(',') + '」にしてください。', [{ label: 'OK', value: true }]); return; }
  const byMonth = {};
  for (const r of rows.slice(1)) {
    const mm = toHalf(r[c('月')] || '').trim().match(/^(\d{4})[-\/.年](\d{1,2})/);
    if (!mm) continue;
    const mk = mm[1] + '-' + pad(+mm[2]);
    const kind = (r[c('種類')] || '').includes('入') ? 'income' : 'out';
    const accName = (c('口座') >= 0 ? r[c('口座')] : '').trim();
    let acc = accName ? state.accounts.find(a => a.name === accName) : null;
    if (accName && !acc) { acc = { id: 'a_' + uid(), name: accName, kind: accName === '手持ち' ? 'cash' : 'bank' }; state.accounts.push(acc); }
    const amt = c('金額') >= 0 ? parseAmount(r[c('金額')] || '0') : 0;
    (byMonth[mk] = byMonth[mk] || { income: [], out: [], done: {} })[kind].push({ id: uid(), name: (r[c('なまえ')] || '').trim().replace(/^'(?=[=+\-@])/, ''), acc: acc ? acc.id : '', amount: Number.isFinite(amt) ? amt : 0, memo: c('メモ') >= 0 ? (r[c('メモ')] || '').trim() : '' });
  }
  const ks = Object.keys(byMonth).sort();
  if (!ks.length) { toast('読み込める行がありませんでした'); return; }
  if (!await confirmDanger(ks.length + 'か月分を読み込みますか？', monthLabel(ks[0]) + '〜' + monthLabel(ks[ks.length - 1]) + '。同じ月があれば置き換わります。', '読み込む')) return;
  for (const k of ks) state.months[k] = byMonth[k];
  save(); toast('読み込みました'); render();
});

}

function ask(title, text, buttons) {
  return new Promise(resolve => {
    openSheet(title, '', '<p>' + esc(text) + '</p><div class="btn-col" id="askBtns"></div>');
    sheetResolve = resolve;
    for (const b of buttons) {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'btn' + (b.cls ? ' ' + b.cls : ''); el.textContent = b.label;
      el.addEventListener('click', () => closeSheet(b.value));
      $('askBtns').appendChild(el);
    }
  });
}
function confirmDanger(title, text, label) {
  return ask(title, text, [{ label: label || '消す', value: true, cls: 'danger' }, { label: 'やめる', value: false }]).then(v => v === true);
}
function amountInput(inp) {
  inp.addEventListener('input', () => {
    const d = toHalf(inp.value).replace(/[^\d]/g, '');
    inp.value = d ? nf.format(parseInt(d, 10)) : '';
  });
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

/* =========================================================
   起動
   ========================================================= */
applyTheme(getTheme());
(() => {
  const cur = monthKey(new Date()), prev = latestMonthBefore(cur);
  if (!state.months[cur] && prev) { copyMonth(cur, prev); setTimeout(() => toast(monthLabel(cur) + 'を「毎月入れる」もので作りました'), 300); }
})();
save();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
