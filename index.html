<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="description" content="月ごとの収入・固定費・積立・変動費と口座の移動を管理する家計簿">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #6f6d68;
  --border: rgba(11,11,11,0.10);
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --c-fixed: #2a78d6;
  --c-saving: #1baf7a;
  --c-variable: #eb6834;
  --c-rest: #d9d8d2;
  --c-income: #0b0b0b;
  --in-text: #1c5cab;
  --out-text: #b8471c;
  --critical: #d03b3b;
  --critical-text: #b42828;
  --good-text: #006300;
  --track: #e8e7e2;
  --check: #2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a988f;
    --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --accent-ink: #ffffff;
    --c-fixed: #3987e5; --c-saving: #199e70; --c-variable: #d95926; --c-rest: #44443f; --c-income: #f0efec;
    --in-text: #86b6ef; --out-text: #f0956a;
    --critical: #d03b3b; --critical-text: #f08585; --good-text: #3fc23f;
    --track: #2c2c2a; --check: #3987e5; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #9a988f;
  --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --accent-ink: #ffffff;
  --c-fixed: #3987e5; --c-saving: #199e70; --c-variable: #d95926; --c-rest: #44443f; --c-income: #f0efec;
  --in-text: #86b6ef; --out-text: #f0956a;
  --critical: #d03b3b; --critical-text: #f08585; --good-text: #3fc23f;
  --track: #2c2c2a; --check: #3987e5; --shadow: none;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 10; background: var(--page);
  padding: calc(6px + env(safe-area-inset-top)) 16px 6px; border-bottom: 1px solid var(--border);
}
.month-nav { display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin: 0 auto; }
.month-nav h1 { margin: 0; font-size: 18px; }
.month-nav h1 button { background: none; border: 0; padding: 4px 8px; font-weight: 700; font-size: 18px; border-radius: 8px; }
.month-nav h1 button:disabled { color: var(--text); opacity: 1; cursor: default; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent;
  font-size: 24px; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--surface-2); }

main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
.view { display: none; }
.view.active { display: block; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h2 { font-size: 16px; margin: 0 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .right { margin-left: auto; font-size: 16px; }
.card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px 0; margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- Summary ---------- */
.hero-label { font-size: 13px; color: var(--text-2); }
.hero-value { font-size: 36px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; }
.hero-value.neg { color: var(--critical-text); }
.hero-status { font-size: 13px; font-weight: 700; margin-left: 6px; vertical-align: 6px; }
.hero-status.neg { color: var(--critical-text); }
.hero-status.pos { color: var(--good-text); }
.seg-bar { position: relative; display: flex; gap: 2px; height: 28px; margin: 22px 0 4px; }
.seg-bar > div { height: 100%; min-width: 3px; }
.seg-bar > div:first-child { border-radius: 6px 0 0 6px; }
.seg-bar > div:nth-last-child(1 of :not(.income-mark)) { border-radius: 0 6px 6px 0; }
.seg-bar > div.income-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; height: auto; min-width: 0; background: var(--c-income); border-radius: 0; }
.income-mark span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: var(--text); font-weight: 700; }
.seg-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.cascade { margin: 12px 0 0; padding: 0; list-style: none; }
.cascade li { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 15px; }
.cascade li .lbl { flex: 1; min-width: 0; }
.cascade li .op { width: 14px; color: var(--muted); text-align: center; flex: none; }
.cascade li.sub { border-top: 1px dashed var(--grid); font-weight: 700; }
.cascade li.sub .lbl { color: var(--text-2); font-weight: 600; font-size: 13px; }
.cascade li.total { border-top: 2px solid var(--text); font-weight: 800; font-size: 17px; padding-top: 8px; margin-top: 2px; }
.cascade .neg { color: var(--critical-text); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--text-2); }
.pill b { color: var(--text); }

/* ---------- Section lists ---------- */
.sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sec-head h2 { margin: 0; }
.sec-head .total { margin-left: auto; font-weight: 800; font-size: 17px; }
.sec-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 10px; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--grid); min-height: 56px; }
.check {
  flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0;
  display: flex; align-items: center; justify-content: center; margin-left: -10px;
}
.check i {
  width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--axis);
  display: flex; align-items: center; justify-content: center; font-style: normal; color: transparent; font-size: 14px; font-weight: 900;
}
.check[aria-checked="true"] i { background: var(--check); border-color: var(--check); color: #fff; }
.item-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 8px 0; text-align: left; min-height: 56px;
}
.item-main .t { flex: 1; min-width: 0; }
.item-main .n { font-size: 15px; }
.item[data-done="true"] .item-main .n { color: var(--text-2); }
.item-main .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-main .a { font-weight: 700; white-space: nowrap; font-size: 15px; }
.item-main .a.zero { color: var(--muted); font-weight: 400; }
.usage { margin-top: 4px; }
.usage .track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.usage .fill { height: 100%; background: var(--c-variable); border-radius: 3px; }
.usage .fill.over { background: var(--critical); }
.usage .u { font-size: 11px; color: var(--muted); margin-top: 2px; }
.usage .u.over { color: var(--critical-text); font-weight: 700; }
.add-row { border-top: 1px solid var(--grid); }
.add-row button { width: 100%; background: none; border: 0; color: var(--accent); font-weight: 600; padding: 12px 0; text-align: left; font-size: 15px; min-height: 48px; }

/* ---------- Accounts (moves) ---------- */
.move-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.tile .label { font-size: 12px; color: var(--text-2); }
.tile .value { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.acct-head .nm { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; }
.owner { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 2px 8px; color: var(--text-2); font-weight: 400; white-space: nowrap; }
.done-btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 36px; white-space: nowrap;
}
.done-btn[aria-pressed="true"] { background: var(--check); color: #fff; border-color: var(--check); font-weight: 700; }
.mv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.mv-grid label { display: block; }
.mv-grid label > span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.mv-grid input { text-align: right; font-weight: 700; }
.auto-tag { font-size: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); font-style: normal; }
.reset-auto { border: 0; background: none; color: var(--accent); font-size: 11px; padding: 0; margin-left: auto; }
.mv-result { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
.mv-result .lbl { font-size: 13px; color: var(--text-2); }
.mv-result .val { font-size: 20px; font-weight: 800; }
.dir { font-size: 12px; font-weight: 700; margin-left: 6px; }
.dir.in { color: var(--in-text); }
.dir.out { color: var(--out-text); }
.mv-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.mv-warn { font-size: 12px; color: var(--critical-text); font-weight: 700; margin-top: 4px; }

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: 14px; }
label.field > span, .field-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
input[type="text"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background-color: var(--surface); font-size: 16px; min-height: 46px; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.big-amount { position: relative; }
.big-amount input { font-size: 28px; font-weight: 700; padding-right: 44px; text-align: right; }
.big-amount .yen { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip .rest { font-size: 11px; opacity: 0.8; margin-left: 4px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  padding: 10px 16px; font-weight: 600; min-height: 48px; width: 100%;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--critical-text); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; width: auto; }
.btn:active { opacity: 0.85; }
.btn:disabled { opacity: 0.4; }
.btn-col { display: grid; gap: 8px; }
.sticky-actions { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom)); z-index: 5; background: var(--surface); margin: 0 -16px; padding: 8px 16px; }

.set-list { list-style: none; margin: 0 0 12px; padding: 0; }
.set-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.set-list li .grow { flex: 1; min-width: 0; }
.set-list li .sub { font-size: 12px; color: var(--muted); }

/* Logs */
.log-list { list-style: none; margin: 0; padding: 0; }
.log-list li { border-top: 1px solid var(--grid); }
.log-list button { width: 100%; display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 10px 0; text-align: left; min-height: 52px; }
.log-list .d { font-size: 12px; color: var(--muted); width: 48px; flex: none; }
.log-list .t { flex: 1; min-width: 0; }
.log-list .t .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-list .a { font-weight: 700; }

/* Trend chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tick { width: 14px; height: 2px; background: var(--c-income); display: inline-block; flex: none; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap .axis-label { fill: var(--muted); font-size: 11px; }
.chart-wrap .gridline { stroke: var(--grid); stroke-width: 1; }
.chart-wrap .baseline { stroke: var(--axis); stroke-width: 1; }
.chart-wrap .hit { fill: transparent; cursor: pointer; }
.chart-wrap .hit.on { fill: var(--surface-2); }
.chart-wrap .bar, .chart-wrap .inc { pointer-events: none; }
.chart-wrap .inc { stroke: var(--c-income); stroke-width: 2.5; stroke-linecap: round; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.14); white-space: nowrap; display: none;
}
.tooltip .t-title { font-weight: 700; margin-bottom: 2px; }
.tooltip .t-row { display: flex; align-items: center; gap: 6px; }
.tooltip .t-row b { margin-left: auto; padding-left: 14px; }
details.table-view { margin-top: 10px; font-size: 13px; }
details.table-view summary { color: var(--text-2); cursor: pointer; padding: 4px 0; }
.table-scroll { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; margin-top: 6px; white-space: nowrap; }
table.data th, table.data td { padding: 6px 4px; border-bottom: 1px solid var(--grid); text-align: right; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--text-2); font-weight: 600; }
table.data a { color: var(--accent); }
table.data .neg { color: var(--critical-text); }

/* ---------- Bottom nav ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 640px; margin: 0 auto; padding: 0; list-style: none; }
.tabbar button { width: 100%; height: 60px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar .add-btn span.plus { width: 48px; height: 48px; border-radius: 24px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; margin-top: -6px; }

/* ---------- Sheet (modal) & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
.modal-back.open { display: flex; }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
.modal h3 { margin: 0 0 12px; font-size: 17px; }
.modal p { margin: 0 0 16px; color: var(--text-2); font-size: 14px; white-space: pre-line; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--page); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="app-header">
  <div class="month-nav">
    <button class="icon-btn" id="prevMonth" aria-label="前の月">‹</button>
    <h1><button id="monthLabel" aria-label="今月に戻る"></button></h1>
    <button class="icon-btn" id="nextMonth" aria-label="次の月">›</button>
  </div>
</header>

<main>
  <section class="view active" id="view-plan" aria-label="今月"></section>
  <section class="view" id="view-accounts" aria-label="口座の移動"></section>
  <section class="view" id="view-log" aria-label="支出の記録"></section>
  <section class="view" id="view-trend" aria-label="推移"></section>
  <section class="view" id="view-settings" aria-label="設定"></section>
</main>

<nav class="tabbar" aria-label="メニュー">
  <ul>
    <li><button data-view="plan" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>今月</button></li>
    <li><button data-view="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>口座</button></li>
    <li><button data-view="log" class="add-btn" aria-label="使ったお金を記録"><span class="plus" aria-hidden="true">＋</span></button></li>
    <li><button data-view="trend">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>推移</button></li>
    <li><button data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="7" cy="18" r="2" fill="var(--surface)"/></svg>設定</button></li>
  </ul>
</nav>

<div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="dlNames"></datalist>

<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>

<script>
'use strict';
/* =========================================================
   定義
   ========================================================= */
const STORAGE_KEY = 'kakeibo.v2';
const OLD_KEY = 'kakeibo.v1';
const THEME_KEY = 'kakeibo.theme';

const SECTIONS = [
  { key: 'income',   label: '収入',   viaLabel: '入金口座',   color: null },
  { key: 'fixed',    label: '固定費', viaLabel: '支払い方法', color: 'var(--c-fixed)' },
  { key: 'saving',   label: '積立',   viaLabel: '支払い方法', color: 'var(--c-saving)' },
  { key: 'variable', label: '変動費', viaLabel: '支払い方法', color: 'var(--c-variable)' }
];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.key, s]));

function defaultState() {
  return {
    version: 2,
    owners: ['共通'],
    accounts: [],
    methods: [
      { id: 'm_cash', name: '手持ち', accountId: '', cash: true },
      { id: 'm_transfer', name: '振込', accountId: '', cash: false },
      { id: 'm_card', name: 'カード', accountId: '', cash: false }
    ],
    months: {},
    tx: []
  };
}

/* =========================================================
   保存・読み込み
   ========================================================= */
let state = loadState();
let storageOk = true;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeState(JSON.parse(raw));
    const old = localStorage.getItem(OLD_KEY);
    if (old) return normalizeState(JSON.parse(old));
  } catch (e) { console.warn(e); }
  return defaultState();
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; toast('保存できませんでした。ブラウザの設定を確認してください'); }
}

function normalizeState(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  if (s.data && s.app === 'kakeibo') s = s.data;
  // 旧バージョン（日々の記録だけの形式）からの移行
  if (s.version === 1 || (!s.months && Array.isArray(s.tx))) {
    d.tx = (s.tx || []).filter(t => t && t.type !== 'income' && validDate(t.date) && Number(t.amount) > 0)
      .map(t => ({ id: String(t.id || uid()), date: t.date, amount: Math.round(+t.amount), item: String(t.category || t.item || 'その他'), memo: String(t.memo || '') }));
    return d;
  }
  const out = {
    version: 2,
    owners: Array.isArray(s.owners) && s.owners.length ? s.owners.map(String) : d.owners,
    accounts: Array.isArray(s.accounts) ? s.accounts.filter(a => a && a.id && a.name).map(a => ({ id: String(a.id), name: String(a.name), owner: String(a.owner || ''), sweep: !!a.sweep })) : [],
    methods: Array.isArray(s.methods) && s.methods.length ? s.methods.filter(m => m && m.id && m.name).map(m => ({ id: String(m.id), name: String(m.name), accountId: String(m.accountId || ''), cash: !!m.cash })) : d.methods,
    months: {},
    tx: Array.isArray(s.tx) ? s.tx.filter(t => t && validDate(t.date) && Number(t.amount) > 0).map(t => ({ id: String(t.id || uid()), date: t.date, amount: Math.round(+t.amount), item: String(t.item || 'その他'), memo: String(t.memo || '') })) : []
  };
  if (s.months && typeof s.months === 'object') {
    for (const [mk, m] of Object.entries(s.months)) {
      if (!/^\d{4}-\d{2}$/.test(mk) || !m) continue;
      const nm = { moves: {}, memo: String(m.memo || '') };
      for (const sec of SECTIONS) {
        nm[sec.key] = Array.isArray(m[sec.key]) ? m[sec.key].filter(it => it && it.name !== undefined).map(it => ({
          id: String(it.id || uid()), name: String(it.name), owner: String(it.owner || ''), via: String(it.via || ''),
          amount: Number.isFinite(+it.amount) ? Math.round(+it.amount) : 0, done: !!it.done, memo: String(it.memo || '')
        })) : [];
      }
      if (m.moves && typeof m.moves === 'object') {
        for (const [aid, mv] of Object.entries(m.moves)) {
          if (!mv) continue;
          nm.moves[aid] = { before: numOrNull(mv.before), need: numOrNull(mv.need), amount: numOrNull(mv.amount), done: !!mv.done, memo: String(mv.memo || '') };
        }
      }
      out.months[mk] = nm;
    }
  }
  return out;
}
function numOrNull(v) { return (v === null || v === undefined || v === '' || !Number.isFinite(+v)) ? null : Math.round(+v); }
function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* =========================================================
   ユーティリティ
   ========================================================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const dateKey = d => monthKey(d) + '-' + pad(d.getDate());
function addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function monthLabel(mk) { const [y, m] = mk.split('-').map(Number); return y + '年' + m + '月'; }
const shortMonth = mk => Number(mk.split('-')[1]) + '月';
const nf = new Intl.NumberFormat('ja-JP');
function yen(n) { return (n < 0 ? '−¥' : '¥') + nf.format(Math.abs(Math.round(n))); }
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー−]/g, '-'); }
function parseAmount(str) {
  const s = toHalf(str).replace(/[,，\s円¥￥+]/g, '');
  if (!/^-?\d+$/.test(s)) return NaN;
  return parseInt(s, 10);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtInput(n) { return n === null || n === undefined ? '' : (n < 0 ? '-' : '') + nf.format(Math.abs(n)); }
const sum = arr => arr.reduce((a, b) => a + b, 0);

/* =========================================================
   計算
   ========================================================= */
const methodById = id => state.methods.find(m => m.id === id);
const accountById = id => state.accounts.find(a => a.id === id);
function accountLabel(a) { return a.name + (a.owner && a.owner !== 'ー' ? '・' + a.owner : ''); }
function viaName(secKey, via) {
  if (!via) return '';
  if (secKey === 'income') { const a = accountById(via); return a ? accountLabel(a) : ''; }
  const m = methodById(via); return m ? m.name : '';
}

function monthTotals(m) {
  const t = {};
  for (const s of SECTIONS) t[s.key] = sum(m[s.key].map(i => i.amount));
  t.a = t.income - t.fixed;          // ① 収入 − 固定費
  t.b = t.a - t.saving;              // ② ① − 積立
  t.rest = t.b - t.variable;         // 残り
  t.cash = sum(['fixed', 'saving', 'variable'].flatMap(k => m[k]).filter(i => { const me = methodById(i.via); return me && me.cash; }).map(i => i.amount));
  const all = SECTIONS.flatMap(s => m[s.key]);
  t.doneCount = all.filter(i => i.done).length;
  t.count = all.length;
  return t;
}
// 口座ごとの引落合計（支払い方法がその口座に結びついている項目）
function accountDebits(m, accId) {
  const items = ['fixed', 'saving', 'variable'].flatMap(k => m[k]).filter(i => { const me = methodById(i.via); return me && me.accountId === accId; });
  return { items, total: sum(items.map(i => i.amount)) };
}
const ceil1000 = v => v > 0 ? Math.ceil(v / 1000) * 1000 : 0;
function suggestMove(diff, sweep) {
  if (diff > 0) return Math.ceil(diff / 1000) * 1000;                // 足りない分は千円単位で切り上げて入金
  if (diff < 0 && sweep) return -Math.floor(-diff / 1000) * 1000;    // 給与口座などは、必要額を割らないよう千円単位で余りを出金
  return 0;                                                          // 貯金用の口座などは、余っていても出金しない
}
function moveInfo(m, acc) {
  const mv = m.moves[acc.id] || { before: null, need: null, amount: null, done: false, memo: '' };
  const deb = accountDebits(m, acc.id);
  const autoNeed = ceil1000(deb.total);
  const need = mv.need ?? autoNeed;
  const suggestion = mv.before === null ? null : suggestMove(need - mv.before, acc.sweep);
  const amount = mv.amount ?? suggestion;
  const after = mv.before === null || amount === null ? null : mv.before + amount;
  return { mv, deb, autoNeed, need, suggestion, amount, after };
}

/* =========================================================
   月の作成（前月コピー＝固定費などの自動入力）
   ========================================================= */
function latestMonthBefore(mk) {
  const keys = Object.keys(state.months).filter(k => k < mk).sort();
  return keys.length ? keys[keys.length - 1] : null;
}
function createMonth(mk, fromKey) {
  const nm = { income: [], fixed: [], saving: [], variable: [], moves: {}, memo: '' };
  const src = fromKey && state.months[fromKey];
  if (src) {
    for (const s of SECTIONS) nm[s.key] = src[s.key].map(i => ({ ...i, id: uid(), done: false }));
    for (const [aid, mv] of Object.entries(src.moves)) {
      // 手で決めていた必要額・移動額（毎月の児童手当の入金など）は引き継ぐ。残高は毎月入れ直す
      nm.moves[aid] = { before: null, need: mv.need, amount: mv.amount, done: false, memo: '' };
    }
  }
  state.months[mk] = nm;
  save();
}

/* =========================================================
   画面の状態
   ========================================================= */
let viewMonth = monthKey(new Date());
let currentView = 'plan';
let logEditId = null;
let logItem = null;

function showView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tabbar button').forEach(b => b.dataset.view === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => { if (b.dataset.view === 'log') logEditId = null; showView(b.dataset.view); }));
$('prevMonth').addEventListener('click', () => { viewMonth = addMonths(viewMonth, -1); render(); });
$('nextMonth').addEventListener('click', () => { viewMonth = addMonths(viewMonth, 1); render(); });
$('monthLabel').addEventListener('click', () => { viewMonth = monthKey(new Date()); render(); });

function render() {
  const showNav = ['plan', 'accounts', 'log'].includes(currentView);
  $('prevMonth').style.visibility = $('nextMonth').style.visibility = showNav ? 'visible' : 'hidden';
  $('monthLabel').disabled = !showNav;
  $('monthLabel').textContent = showNav ? monthLabel(viewMonth) : (currentView === 'trend' ? '推移' : '設定');
  ({ plan: renderPlan, accounts: renderAccounts, log: renderLog, trend: renderTrend, settings: renderSettings })[currentView]();
}

function noMonthCard(container) {
  const prev = latestMonthBefore(viewMonth);
  container.innerHTML = '<div class="card"><h2>' + monthLabel(viewMonth) + 'の計画はまだありません</h2>' +
    '<p class="note" style="margin:0 0 14px">' + (prev ? monthLabel(prev) + 'の項目（収入・固定費・積立・変動費・口座）をそのままコピーして作れます。金額はあとで直せます。チェックは外れた状態で始まります。' : '項目を追加して計画を作ります。') + '</p>' +
    '<div class="btn-col">' + (prev ? '<button class="btn primary" id="mkCopy">' + monthLabel(prev) + 'をコピーして作る</button>' : '') +
    '<button class="btn' + (prev ? '' : ' primary') + '" id="mkEmpty">空の計画を作る</button></div></div>';
  if (prev) $('mkCopy').addEventListener('click', () => { createMonth(viewMonth, prev); toast(monthLabel(prev) + 'をコピーしました'); render(); });
  $('mkEmpty').addEventListener('click', () => { createMonth(viewMonth, null); render(); });
}

/* =========================================================
   今月（計画）
   ========================================================= */
function renderPlan() {
  const box = $('view-plan');
  const m = state.months[viewMonth];
  if (!m) { noMonthCard(box); return; }
  const t = monthTotals(m);
  const spent = spentByItem(viewMonth);
  const hasLogs = Object.keys(spent).length > 0;

  // 帯グラフ：収入に対して固定費・積立・変動費・残り
  const out = t.fixed + t.saving + t.variable;
  const scale = Math.max(t.income, out, 1);
  const segs = [['固定費', t.fixed, 'var(--c-fixed)'], ['積立', t.saving, 'var(--c-saving)'], ['変動費', t.variable, 'var(--c-variable)']];
  if (t.rest > 0) segs.push(['残り', t.rest, 'var(--c-rest)']);
  const bar = segs.filter(s => s[1] > 0).map(s => '<div style="width:' + (s[1] / scale * 100) + '%;background:' + s[2] + '" title="' + s[0] + ' ' + yen(s[1]) + '"></div>').join('');
  const incomeMark = t.rest < 0 && t.income > 0 ? '<div class="income-mark" style="left:calc(' + (t.income / scale * 100) + '% - 1px)"><span>収入</span></div>' : '';

  let html = '<div class="card">' +
    '<div class="hero-label">今月の残り（収入 − 固定費 − 積立 − 変動費）</div>' +
    '<div><span class="hero-value num' + (t.rest < 0 ? ' neg' : '') + '">' + yen(t.rest) + '</span>' +
    '<span class="hero-status ' + (t.rest < 0 ? 'neg">⚠ 赤字' : 'pos">✓ 黒字') + '</span></div>' +
    '<div class="seg-bar" role="img" aria-label="収入に対する内訳">' + bar + incomeMark + '</div>' +
    '<div class="seg-scale num"><span>0</span><span>' + (t.rest < 0 ? '支出 ' + yen(out) : '収入 ' + yen(t.income)) + '</span></div>' +
    '<ul class="cascade num">' +
      '<li><span class="op"></span><span class="lbl">収入</span><b>' + yen(t.income) + '</b></li>' +
      '<li><span class="op">−</span><i class="swatch" style="background:var(--c-fixed)"></i><span class="lbl">固定費</span><span>' + yen(t.fixed) + '</span></li>' +
      '<li class="sub"><span class="op">＝</span><span class="lbl">①（収入 − 固定費）</span><span class="' + (t.a < 0 ? 'neg' : '') + '">' + yen(t.a) + '</span></li>' +
      '<li><span class="op">−</span><i class="swatch" style="background:var(--c-saving)"></i><span class="lbl">積立</span><span>' + yen(t.saving) + '</span></li>' +
      '<li class="sub"><span class="op">＝</span><span class="lbl">②（① − 積立）</span><span class="' + (t.b < 0 ? 'neg' : '') + '">' + yen(t.b) + '</span></li>' +
      '<li><span class="op">−</span><i class="swatch" style="background:var(--c-variable)"></i><span class="lbl">変動費</span><span>' + yen(t.variable) + '</span></li>' +
      '<li class="total"><span class="op">＝</span><span class="lbl">残り</span><span class="' + (t.rest < 0 ? 'neg' : '') + '">' + yen(t.rest) + '</span></li>' +
    '</ul>' +
    '<div class="pills num"><span class="pill">💴 手持ちで用意 <b>' + yen(t.cash) + '</b></span>' +
    '<span class="pill">✓ 済み <b>' + t.doneCount + '</b> / ' + t.count + '</span></div>' +
    '</div>';

  for (const s of SECTIONS) {
    const items = m[s.key];
    const total = sum(items.map(i => i.amount));
    const done = items.filter(i => i.done).length;
    html += '<div class="card"><div class="sec-head">' + (s.color ? '<i class="swatch" style="background:' + s.color + '"></i>' : '') +
      '<h2>' + s.label + '</h2><span class="total num">' + yen(total) + '</span></div>' +
      '<div class="sec-meta"><span>' + items.length + '項目</span><span>済み ' + done + ' / ' + items.length + '</span></div><ul class="items">';
    for (const it of items) {
      const via = viaName(s.key, it.via);
      const sub = [it.owner && it.owner !== 'ー' ? it.owner : '', via, it.memo].filter(Boolean).join('・');
      let usage = '';
      if (s.key === 'variable' && hasLogs) {
        const u = spent[varKey(it, items)] || 0;
        const over = u > it.amount;
        usage = '<div class="usage"><div class="track"><div class="fill' + (over ? ' over' : '') + '" style="width:' + (it.amount ? Math.min(100, u / it.amount * 100) : (u ? 100 : 0)) + '%"></div></div>' +
          '<div class="u num' + (over ? ' over' : '') + '">使った ' + yen(u) + '　' + (over ? '⚠ ' + yen(u - it.amount) + ' 超過' : '残り ' + yen(it.amount - u)) + '</div></div>';
      }
      html += '<li class="item" data-done="' + it.done + '">' +
        '<button class="check" role="checkbox" aria-checked="' + it.done + '" aria-label="' + esc(it.name) + 'を済みにする" data-sec="' + s.key + '" data-id="' + it.id + '"><i>✓</i></button>' +
        '<button class="item-main" data-sec="' + s.key + '" data-id="' + it.id + '"><span class="t"><div class="n">' + esc(it.name || '（名前なし）') + '</div>' +
        (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + usage + '</span>' +
        '<span class="a num' + (it.amount ? '' : ' zero') + '">' + yen(it.amount) + '</span></button></li>';
    }
    html += '<li class="add-row"><button data-add="' + s.key + '">＋ ' + s.label + 'を追加</button></li></ul></div>';
  }
  html += '<div class="card"><label class="field" style="margin:0"><span>今月のメモ</span><textarea id="monthMemo" rows="3" placeholder="例：水道代は次回9月">' + esc(m.memo) + '</textarea></label></div>';
  html += '<div class="btn-col"><button class="btn danger" id="delMonth">' + monthLabel(viewMonth) + 'の計画を削除</button></div>';
  box.innerHTML = html;

  box.querySelectorAll('.check').forEach(b => b.addEventListener('click', () => {
    const it = m[b.dataset.sec].find(x => x.id === b.dataset.id);
    if (!it) return;
    it.done = !it.done; save();
    b.setAttribute('aria-checked', String(it.done));
    b.closest('.item').dataset.done = String(it.done);
    const tt = monthTotals(m);
    box.querySelectorAll('.pill b')[1].textContent = tt.doneCount;
    const meta = b.closest('.card').querySelector('.sec-meta span:last-child');
    const list = m[b.dataset.sec];
    meta.textContent = '済み ' + list.filter(i => i.done).length + ' / ' + list.length;
  }));
  box.querySelectorAll('.item-main').forEach(b => b.addEventListener('click', () => editItem(b.dataset.sec, b.dataset.id)));
  box.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => editItem(b.dataset.add, null)));
  $('monthMemo').addEventListener('change', e => { m.memo = e.target.value; save(); });
  $('delMonth').addEventListener('click', async () => {
    if (!await confirmDanger(monthLabel(viewMonth) + 'の計画を削除しますか？', '収入・固定費・積立・変動費・口座の移動がすべて消えます。使ったお金の記録は残ります。')) return;
    delete state.months[viewMonth]; save(); render();
  });
}

function itemNameSuggestions(secKey) {
  const set = new Set();
  for (const m of Object.values(state.months)) for (const i of m[secKey]) if (i.name) set.add(i.name);
  return [...set];
}
function viaOptions(secKey, cur) {
  let opts = '<option value="">なし</option>';
  if (secKey === 'income') opts += state.accounts.map(a => '<option value="' + a.id + '"' + (a.id === cur ? ' selected' : '') + '>' + esc(accountLabel(a)) + '</option>').join('');
  else opts += state.methods.map(me => '<option value="' + me.id + '"' + (me.id === cur ? ' selected' : '') + '>' + esc(me.name) + '</option>').join('');
  return opts;
}
function ownerOptions(cur) {
  const list = state.owners.slice();
  if (cur && !list.includes(cur)) list.push(cur);
  return '<option value="">なし</option>' + list.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
}

function editItem(secKey, id) {
  const m = state.months[viewMonth];
  const s = SEC[secKey];
  const it = id ? m[secKey].find(x => x.id === id) : null;
  const cashId = (state.methods.find(x => x.cash) || {}).id || '';
  const v = it || { name: '', owner: '', via: secKey === 'variable' || secKey === 'saving' ? cashId : '', amount: 0, memo: '' };
  $('dlNames').innerHTML = itemNameSuggestions(secKey).map(n => '<option value="' + esc(n) + '">').join('');
  openSheet((it ? s.label + 'を編集' : s.label + 'を追加'),
    '<form id="itemForm" autocomplete="off">' +
    '<label class="field"><span>項目</span><input type="text" id="iName" list="dlNames" maxlength="40" value="' + esc(v.name) + '" placeholder="例：' + ({ income: '給与', fixed: '電気代', saving: '車検', variable: '食費' })[secKey] + '"></label>' +
    '<label class="field"><span>金額</span><div class="big-amount"><input type="text" inputmode="numeric" id="iAmount" value="' + (v.amount ? fmtInput(v.amount) : '') + '" placeholder="0"><span class="yen">円</span></div></label>' +
    '<div class="row"><label class="field"><span>名義</span><select id="iOwner">' + ownerOptions(v.owner) + '</select></label>' +
    '<label class="field"><span>' + s.viaLabel + '</span><select id="iVia">' + viaOptions(secKey, v.via) + '</select></label></div>' +
    '<label class="field"><span>メモ</span><input type="text" id="iMemo" maxlength="100" value="' + esc(v.memo) + '"></label>' +
    '<div class="btn-col"><button type="submit" class="btn primary">保存する</button>' +
    (it ? '<button type="button" class="btn danger" id="iDel">この項目を削除</button>' : '') +
    '<button type="button" class="btn" id="iCancel">キャンセル</button></div></form>');
  if (!it) setTimeout(() => $('iName') && $('iName').focus(), 50);
  attachAmountFormatter($('iAmount'));
  $('iCancel').addEventListener('click', () => closeSheet());
  if (it) $('iDel').addEventListener('click', async () => {
    if (!await confirmDanger('「' + it.name + '」を削除しますか？', 'この月の計画から消えます。')) return;
    m[secKey] = m[secKey].filter(x => x.id !== id); save(); render();
  });
  $('itemForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('iName').value.trim();
    const amtRaw = $('iAmount').value.trim();
    const amount = amtRaw === '' ? 0 : parseAmount(amtRaw);
    if (!name) { toast('項目名を入力してください'); return; }
    if (!Number.isFinite(amount)) { toast('金額は数字で入力してください'); return; }
    const rec = { name, amount, owner: $('iOwner').value, via: $('iVia').value, memo: $('iMemo').value.trim() };
    if (it) Object.assign(it, rec); else m[secKey].push({ id: uid(), done: false, ...rec });
    save(); closeSheet(); render();
  });
}

/* =========================================================
   口座の移動
   ========================================================= */
function renderAccounts() {
  const box = $('view-accounts');
  const m = state.months[viewMonth];
  if (!m) { noMonthCard(box); return; }
  if (!state.accounts.length) {
    box.innerHTML = '<div class="card"><h2>口座がまだありません</h2><p class="note" style="margin:0 0 12px">「設定」で口座と支払い方法（引落先の口座）を登録すると、口座ごとに必要な額と移動する額が自動で出ます。</p><button class="btn primary" id="goSet">設定を開く</button></div>';
    $('goSet').addEventListener('click', () => showView('settings'));
    return;
  }
  const infos = state.accounts.map(a => ({ a, ...moveInfo(m, a) }));
  const prevKey = latestMonthBefore(viewMonth);
  const prevAfter = a => { if (!prevKey) return null; const pm = state.months[prevKey]; return pm.moves[a.id] ? moveInfo(pm, a).after : null; };
  const inSum = sum(infos.map(i => i.amount > 0 ? i.amount : 0));
  const outSum = sum(infos.map(i => i.amount < 0 ? -i.amount : 0));
  const t = monthTotals(m);
  const doneN = infos.filter(i => i.mv.done).length;
  let html = '<div class="card"><div class="move-sum num">' +
    '<div class="tile"><div class="label">入金の合計</div><div class="value" style="color:var(--in-text)">' + yen(inSum) + '</div></div>' +
    '<div class="tile"><div class="label">出金の合計</div><div class="value" style="color:var(--out-text)">' + yen(outSum) + '</div></div>' +
    '<div class="tile"><div class="label">手持ちで用意</div><div class="value">' + yen(t.cash) + '</div></div></div>' +
    '<p class="note">移動済み ' + doneN + ' / ' + infos.length + '口座。移動前の残高を入れると、移動する額が千円単位で自動で出ます（手で変えられます）。</p></div>';

  for (const i of infos) {
    const dir = i.amount > 0 ? '<span class="dir in">↑ 入金</span>' : i.amount < 0 ? '<span class="dir out">↓ 出金</span>' : '';
    const short = i.after !== null && i.after < i.need ? '<div class="mv-warn">⚠ 必要額まで ' + yen(i.need - i.after) + ' 足りません</div>' : '';
    const debTxt = i.deb.items.length ? '引落 ' + i.deb.items.length + '件 ' + yen(i.deb.total) + '（' + i.deb.items.slice(0, 4).map(x => esc(x.name)).join('・') + (i.deb.items.length > 4 ? '…' : '') + '）' : 'この口座から引き落とされる項目はありません';
    html += '<div class="card" data-acc="' + i.a.id + '"><div class="acct-head"><span class="nm">' + esc(i.a.name) + '</span>' +
      (i.a.owner && i.a.owner !== 'ー' ? '<span class="owner">' + esc(i.a.owner) + '</span>' : '') +
      '<button class="done-btn" data-act="done" aria-pressed="' + i.mv.done + '">' + (i.mv.done ? '✓ 移動済み' : '未') + '</button></div>' +
      '<div class="mv-grid">' +
        '<label><span>移動前の残高</span><input type="text" inputmode="numeric" data-f="before" value="' + fmtInput(i.mv.before) + '" placeholder="' + (prevAfter(i.a) !== null ? '先月の移動後 ' + nf.format(prevAfter(i.a)) : '入力') + '"></label>' +
        '<label><span>必要額 ' + (i.mv.need === null ? '<em class="auto-tag">自動</em>' : '<button type="button" class="reset-auto" data-reset="need">自動に戻す</button>') + '</span><input type="text" inputmode="numeric" data-f="need" value="' + fmtInput(i.need) + '"></label>' +
        '<label style="grid-column:1/-1"><span>移動する額（＋入金 / −出金）' + (i.mv.amount === null ? (i.suggestion === null ? '' : '<em class="auto-tag">自動</em>') : '<button type="button" class="reset-auto" data-reset="amount">自動に戻す</button>') + '</span><input type="text" inputmode="numeric" data-f="amount" value="' + (i.amount === null ? '' : fmtInput(i.amount)) + '" placeholder="残高を入れると自動で出ます"></label>' +
      '</div>' +
      '<div class="mv-result"><span class="lbl">移動後の残高</span><span class="num"><span class="val">' + (i.after === null ? '—' : yen(i.after)) + '</span>' + dir + '</span></div>' + short +
      '<div class="mv-sub">' + debTxt + (i.a.sweep ? '<br>余ったお金は出金する口座' : '') + '</div></div>';
  }
  box.innerHTML = html;

  box.querySelectorAll('.card[data-acc]').forEach(card => {
    const aid = card.dataset.acc;
    const get = () => (m.moves[aid] = m.moves[aid] || { before: null, need: null, amount: null, done: false, memo: '' });
    card.querySelectorAll('input[data-f]').forEach(inp => {
      attachAmountFormatter(inp, true);
      inp.addEventListener('change', () => {
        const f = inp.dataset.f;
        const raw = inp.value.trim();
        const n = raw === '' || raw === '-' ? null : parseAmount(raw);
        if (n !== null && !Number.isFinite(n)) { toast('数字で入力してください'); inp.value = ''; return; }
        const mv = get();
        if (f === 'before') mv.before = n;
        if (f === 'need') { const info = moveInfo(m, accountById(aid)); mv.need = n === null || n === info.autoNeed ? null : n; }
        if (f === 'amount') { const info = moveInfo(m, accountById(aid)); mv.amount = n === null || n === info.suggestion ? null : n; }
        save(); renderAccounts();
      });
    });
    card.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); get()[b.dataset.reset] = null; save(); renderAccounts(); }));
    card.querySelector('[data-act="done"]').addEventListener('click', () => { const mv = get(); mv.done = !mv.done; save(); renderAccounts(); });
  });
}

/* =========================================================
   使ったお金の記録（変動費の残り）
   ========================================================= */
// 同じ名前の変動費が複数あるとき（名義ちがいの「おこづかい」など）は名義を付けて区別する
function varKey(it, list) {
  const dup = list.filter(x => x.name === it.name).length > 1;
  return dup && it.owner && it.owner !== 'ー' ? it.name + '（' + it.owner + '）' : it.name;
}
function spentByItem(mk) {
  const r = {};
  for (const t of state.tx) if (t.date.slice(0, 7) === mk) r[t.item] = (r[t.item] || 0) + t.amount;
  return r;
}
function renderLog() {
  const box = $('view-log');
  const m = state.months[viewMonth];
  const names = [...new Set((m ? m.variable.map(i => varKey(i, m.variable)) : []).filter(Boolean))];
  const tx = logEditId ? state.tx.find(t => t.id === logEditId) : null;
  if (tx && !names.includes(tx.item)) names.push(tx.item);
  if (!names.includes('その他')) names.push('その他');
  if (!logItem || !names.includes(logItem)) logItem = tx ? tx.item : names[0];
  const spent = spentByItem(viewMonth);
  const budget = {};
  if (m) for (const i of m.variable) { const k = varKey(i, m.variable); budget[k] = (budget[k] || 0) + i.amount; }
  const now = new Date();
  const defDate = tx ? tx.date : (viewMonth === monthKey(now) ? dateKey(now) : viewMonth + '-01');

  let html = '<form class="card" id="logForm" autocomplete="off"><h2>' + (tx ? '記録を編集' : '使ったお金を記録') + '<small>変動費の残りがわかります</small></h2>' +
    '<label class="field"><span>金額</span><div class="big-amount"><input type="text" inputmode="numeric" id="lAmount" value="' + (tx ? fmtInput(tx.amount) : '') + '" placeholder="0"><span class="yen">円</span></div></label>' +
    '<div class="field-label">項目</div><div class="chips" id="lItems">' + names.map(n => {
      const rest = budget[n] !== undefined ? budget[n] - (spent[n] || 0) : null;
      return '<button type="button" class="chip" aria-pressed="' + (n === logItem) + '" data-item="' + esc(n) + '">' + esc(n) + (rest !== null ? '<span class="rest num">残' + (rest < 0 ? '−' : '') + nf.format(Math.abs(rest)) + '</span>' : '') + '</button>';
    }).join('') + '</div>' +
    '<div class="row"><label class="field"><span>日付</span><input type="date" id="lDate" value="' + defDate + '"></label></div>' +
    '<label class="field"><span>メモ（任意）</span><input type="text" id="lMemo" maxlength="100" value="' + esc(tx ? tx.memo : '') + '" placeholder="例：スーパー"></label>' +
    '<div class="sticky-actions"><button type="submit" class="btn primary">' + (tx ? '変更を保存' : '記録する') + '</button></div>' +
    (tx ? '<div class="btn-col" style="margin-top:16px"><button type="button" class="btn" id="lCancel">キャンセル</button><button type="button" class="btn danger" id="lDel">この記録を削除</button></div>' : '') +
    '</form>';
  if (!m) html += '<div class="card"><p class="note" style="margin:0">' + monthLabel(viewMonth) + 'の計画がまだないので、変動費の予算と比べられません。「今月」で計画を作ると、項目ごとの残りが表示されます。</p></div>';

  const list = state.tx.filter(t => t.date.slice(0, 7) === viewMonth).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  html += '<div class="card"><h2>' + monthLabel(viewMonth) + 'の記録<span class="right num">' + yen(sum(list.map(t => t.amount))) + '</span></h2>';
  html += list.length ? '<ul class="log-list">' + list.map(t => '<li><button data-id="' + t.id + '"><span class="d num">' + Number(t.date.slice(5, 7)) + '/' + Number(t.date.slice(8)) + '</span><span class="t"><div>' + esc(t.item) + '</div>' + (t.memo ? '<div class="m">' + esc(t.memo) + '</div>' : '') + '</span><span class="a num">' + yen(t.amount) + '</span></button></li>').join('') + '</ul>'
    : '<p class="empty">まだ記録はありません</p>';
  html += '</div>';
  box.innerHTML = html;

  attachAmountFormatter($('lAmount'));
  box.querySelectorAll('#lItems .chip').forEach(b => b.addEventListener('click', () => {
    logItem = b.dataset.item;
    box.querySelectorAll('#lItems .chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  }));
  box.querySelectorAll('.log-list button').forEach(b => b.addEventListener('click', () => { logEditId = b.dataset.id; logItem = null; renderLog(); window.scrollTo(0, 0); }));
  if (tx) {
    $('lCancel').addEventListener('click', () => { logEditId = null; renderLog(); });
    $('lDel').addEventListener('click', async () => {
      if (!await confirmDanger('この記録を削除しますか？', '元に戻せません。')) return;
      state.tx = state.tx.filter(x => x.id !== tx.id); logEditId = null; save(); renderLog();
    });
  }
  $('logForm').addEventListener('submit', e => {
    e.preventDefault();
    const amount = parseAmount($('lAmount').value);
    const date = $('lDate').value;
    if (!Number.isFinite(amount) || amount <= 0) { toast('金額を入力してください'); $('lAmount').focus(); return; }
    if (!validDate(date)) { toast('日付を入力してください'); return; }
    const rec = { date, amount, item: logItem, memo: $('lMemo').value.trim() };
    if (tx) { Object.assign(tx, rec); toast('変更しました'); }
    else { state.tx.push({ id: uid(), ...rec }); toast(rec.item + ' ' + yen(amount) + ' を記録しました'); }
    logEditId = null;
    viewMonth = date.slice(0, 7);
    save(); render();
    if (!tx) setTimeout(() => $('lAmount') && $('lAmount').focus(), 30);
  });
}

/* =========================================================
   推移
   ========================================================= */
function renderTrend() {
  const box = $('view-trend');
  const keys = Object.keys(state.months).sort();
  if (!keys.length) { box.innerHTML = '<div class="card"><p class="empty">計画を作った月がまだありません</p></div>'; return; }
  const data = keys.slice(-12).map(k => ({ k, ...monthTotals(state.months[k]) }));
  const maxV = Math.max(1, ...data.map(d => Math.max(d.income, d.fixed + d.saving + d.variable)));
  const step = niceStep(maxV / 4);
  const top = Math.ceil(maxV / step) * step;
  const W = 340, H = 220, L = 44, R = 4, T = 10, B = 24;
  const pw = W - L - R, ph = H - T - B;
  const gw = pw / data.length;
  const bw = Math.min(28, gw * 0.6);
  const y = v => T + ph - v / top * ph;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月ごとの収入と支出の内訳">';
  for (let v = 0; v <= top + 0.5; v += step) {
    svg += '<line class="' + (v === 0 ? 'baseline' : 'gridline') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    svg += '<text class="axis-label num" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + shortYen(v) + '</text>';
  }
  data.forEach((d, i) => {
    const cx = L + i * gw + gw / 2, x = cx - bw / 2;
    svg += '<rect class="hit" data-i="' + i + '" x="' + (L + i * gw) + '" y="' + T + '" width="' + gw + '" height="' + ph + '" rx="6"/>';
    let base = 0;
    const parts = [['fixed', 'var(--c-fixed)'], ['saving', 'var(--c-saving)'], ['variable', 'var(--c-variable)']].filter(p => d[p[0]] > 0);
    parts.forEach((p, j) => {
      const v = d[p[0]];
      const y0 = y(base), y1 = y(base + v);
      const last = j === parts.length - 1;
      const h = Math.max(0, y0 - y1 - (last ? 0 : 2));
      svg += last ? topRounded(x, y0 - h, bw, y0, p[1]) : '<rect class="bar" x="' + x + '" y="' + (y0 - h) + '" width="' + bw + '" height="' + h + '" fill="' + p[1] + '"/>';
      base += v;
    });
    svg += '<line class="inc" x1="' + (x - 5) + '" x2="' + (x + bw + 5) + '" y1="' + y(d.income) + '" y2="' + y(d.income) + '"/>';
    svg += '<text class="axis-label" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + shortMonth(d.k) + '</text>';
  });
  svg += '</svg>';

  box.innerHTML = '<div class="card"><h2>月ごとの推移<small>直近' + data.length + 'か月</small></h2>' +
    '<div class="legend"><span><i class="swatch" style="background:var(--c-fixed)"></i>固定費</span><span><i class="swatch" style="background:var(--c-saving)"></i>積立</span><span><i class="swatch" style="background:var(--c-variable)"></i>変動費</span><span><i class="tick"></i>収入</span></div>' +
    '<div class="chart-wrap" id="trendWrap"><div class="tooltip" id="trendTip"></div>' + svg + '</div>' +
    '<p class="note">棒が収入の線より上に出ている月は赤字です。棒をタップすると金額が出ます。</p>' +
    '<details class="table-view" open><summary>表で見る</summary><div class="table-scroll"><table class="data num"><thead><tr><th>月</th><th>収入</th><th>固定費</th><th>積立</th><th>変動費</th><th>残り</th></tr></thead><tbody>' +
    data.slice().reverse().map(d => '<tr><td><a href="#" data-mk="' + d.k + '">' + d.k.replace('-', '/') + '</a></td><td>' + yen(d.income) + '</td><td>' + yen(d.fixed) + '</td><td>' + yen(d.saving) + '</td><td>' + yen(d.variable) + '</td><td class="' + (d.rest < 0 ? 'neg' : '') + '">' + yen(d.rest) + '</td></tr>').join('') +
    '</tbody></table></div></details></div>';

  const wrap = $('trendWrap'), tip = $('trendTip');
  const showTip = rect => {
    wrap.querySelectorAll('.hit').forEach(h => h.classList.toggle('on', h === rect));
    const d = data[+rect.dataset.i];
    tip.innerHTML = '<div class="t-title">' + monthLabel(d.k) + '</div>' +
      '<div class="t-row"><i class="tick"></i>収入<b class="num">' + yen(d.income) + '</b></div>' +
      '<div class="t-row"><i class="swatch" style="background:var(--c-fixed)"></i>固定費<b class="num">' + yen(d.fixed) + '</b></div>' +
      '<div class="t-row"><i class="swatch" style="background:var(--c-saving)"></i>積立<b class="num">' + yen(d.saving) + '</b></div>' +
      '<div class="t-row"><i class="swatch" style="background:var(--c-variable)"></i>変動費<b class="num">' + yen(d.variable) + '</b></div>' +
      '<div class="t-row">残り<b class="num" style="color:' + (d.rest < 0 ? 'var(--critical-text)' : 'inherit') + '">' + yen(d.rest) + '</b></div>';
    tip.style.display = 'block';
    const wr = wrap.getBoundingClientRect(), rr = rect.getBoundingClientRect();
    tip.style.left = Math.max(0, Math.min(wr.width - tip.offsetWidth, rr.left - wr.left + rr.width / 2 - tip.offsetWidth / 2)) + 'px';
    tip.style.top = '0px';
  };
  wrap.querySelectorAll('.hit').forEach(h => { h.addEventListener('mouseenter', () => showTip(h)); h.addEventListener('click', () => showTip(h)); });
  wrap.querySelector('svg').addEventListener('mouseleave', () => { tip.style.display = 'none'; wrap.querySelectorAll('.hit').forEach(h => h.classList.remove('on')); });
  box.querySelectorAll('a[data-mk]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); viewMonth = a.dataset.mk; showView('plan'); }));
}
function topRounded(x, yTop, w, yBase, color) {
  const h = yBase - yTop; if (h <= 0) return '';
  const r = Math.min(4, h, w / 2);
  return '<path class="bar" fill="' + color + '" d="M' + x + ',' + yBase + 'V' + (yTop + r) + 'Q' + x + ',' + yTop + ' ' + (x + r) + ',' + yTop + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + yTop + ' ' + (x + w) + ',' + (yTop + r) + 'V' + yBase + 'Z"/>';
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function shortYen(v) { return v >= 10000 ? (v / 10000) + '万' : nf.format(v); }

  box.querySelectorAll('[data-edit-me]').forEach(b => b.addEventListener('click', () => editMethod(state.methods[+b.dataset.editMe])));
  $('addMe').addEventListener('click', () => editMethod(null));
  $('expJson').addEventListener('click', () => download('kakeibo_backup_' + dateKey(new Date()) + '.json', JSON.stringify({ app: 'kakeibo', exportedAt: new Date().toISOString(), data: state }, null, 1), 'application/json'));
  $('impJson').addEventListener('click', () => $('fileJson').click());
  $('expPlanCsv').addEventListener('click', () => { if (!Object.keys(state.months).length) { toast('計画がありません'); return; } download('kakeibo_plan_' + dateKey(new Date()) + '.csv', planToCSV(), 'text/csv;charset=utf-8'); });
  $('expTxCsv').addEventListener('click', () => { if (!state.tx.length) { toast('記録がありません'); return; } download('kakeibo_log_' + dateKey(new Date()) + '.csv', txToCSV(), 'text/csv;charset=utf-8'); });
  $('impCsv').addEventListener('click', () => $('fileCsv').click());
  $('wipe').addEventListener('click', async () => {
    if (!await confirmDanger('すべてのデータを削除しますか？', '計画・口座・記録がすべて消えます。元に戻せません。先にバックアップをおすすめします。')) return;
    state = defaultState(); save(); toast('削除しました'); render();
  });
  let bytes = 0; try { bytes = (localStorage.getItem(STORAGE_KEY) || '').length * 2; } catch (e) { /* ignore */ }
  $('storageInfo').textContent = '計画 ' + Object.keys(state.months).length + 'か月分・記録 ' + state.tx.length + '件（約 ' + Math.max(1, Math.round(bytes / 1024)) + ' KB）' + (storageOk ? '' : '　⚠ 保存できていません');
  $('themeSel').value = getTheme();
  $('themeSel').addEventListener('change', e => { try { localStorage.setItem(THEME_KEY, e.target.value); } catch (err) { /* ignore */ } applyTheme(e.target.value); });
}

function editAccount(a) {
  openSheet(a ? '口座を編集' : '口座を追加',
    '<form id="accForm" autocomplete="off"><label class="field"><span>口座の名前</span><input type="text" id="aName" maxlength="40" value="' + esc(a ? a.name : '') + '" placeholder="例：ゆうちょ（引落用）"></label>' +
    '<label class="field"><span>名義</span><select id="aOwner">' + ownerOptions(a ? a.owner : '') + '</select></label>' +
    '<label class="field"><span>必要額より多いとき</span><select id="aSweep"><option value="0"' + (a && a.sweep ? '' : ' selected') + '>そのまま残す（貯金用の口座など）</option><option value="1"' + (a && a.sweep ? ' selected' : '') + '>余りを出金する（給与が入る口座など）</option></select></label>' +
    '<div class="btn-col"><button class="btn primary">保存する</button>' + (a ? '<button type="button" class="btn danger" id="aDel">この口座を削除</button>' : '') + '<button type="button" class="btn" id="aCancel">キャンセル</button></div></form>');
  $('aCancel').addEventListener('click', () => closeSheet());
  if (a) $('aDel').addEventListener('click', async () => {
    if (!await confirmDanger('口座「' + a.name + '」を削除しますか？', 'この口座の移動の記録と、支払い方法・収入との結びつきが外れます。')) return;
    state.accounts = state.accounts.filter(x => x.id !== a.id);
    state.methods.forEach(me => { if (me.accountId === a.id) me.accountId = ''; });
    for (const m of Object.values(state.months)) { delete m.moves[a.id]; m.income.forEach(i => { if (i.via === a.id) i.via = ''; }); }
    save(); render();
  });
  $('accForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('aName').value.trim();
    if (!name) { toast('口座の名前を入力してください'); return; }
    const sweep = $('aSweep').value === '1';
    if (a) { a.name = name; a.owner = $('aOwner').value; a.sweep = sweep; }
    else state.accounts.push({ id: 'a_' + uid(), name, owner: $('aOwner').value, sweep });
    save(); closeSheet(); render();
  });
}
function editMethod(me) {
  openSheet(me ? '支払い方法を編集' : '支払い方法を追加',
    '<form id="meForm" autocomplete="off"><label class="field"><span>名前</span><input type="text" id="meName" maxlength="40" value="' + esc(me ? me.name : '') + '" placeholder="例：引落(ゆうちょ)"></label>' +
    '<label class="field"><span>種類</span><select id="meKind"><option value="debit"' + (me && !me.cash ? ' selected' : '') + '>口座から引き落とし・振込・カード</option><option value="cash"' + (me && me.cash ? ' selected' : '') + '>現金（手持ち）</option></select></label>' +
    '<label class="field" id="meAccWrap"><span>引落先の口座</span><select id="meAcc">' + accOptions(me ? me.accountId : '') + '</select></label>' +
    '<div class="btn-col"><button class="btn primary">保存する</button>' + (me ? '<button type="button" class="btn danger" id="meDel">削除</button>' : '') + '<button type="button" class="btn" id="meCancel">キャンセル</button></div></form>');
  const sync = () => { $('meAccWrap').hidden = $('meKind').value === 'cash'; };
  $('meKind').addEventListener('change', sync); sync();
  $('meCancel').addEventListener('click', () => closeSheet());
  if (me) $('meDel').addEventListener('click', async () => {
    if (!await confirmDanger('「' + me.name + '」を削除しますか？', 'この支払い方法を使っている項目は「なし」になります。')) return;
    state.methods = state.methods.filter(x => x.id !== me.id);
    for (const m of Object.values(state.months)) for (const k of ['fixed', 'saving', 'variable']) m[k].forEach(i => { if (i.via === me.id) i.via = ''; });
    save(); render();
  });
  $('meForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('meName').value.trim();
    if (!name) { toast('名前を入力してください'); return; }
    const cash = $('meKind').value === 'cash';
    const rec = { name, cash, accountId: cash ? '' : $('meAcc').value };
    if (me) Object.assign(me, rec); else state.methods.push({ id: 'm_' + uid(), ...rec });
    save(); closeSheet(); render();
  });
}

/* ---------- テーマ ---------- */
function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

/* =========================================================
   CSV / JSON
   ========================================================= */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@]/.test(s) && !/^-?\d+$/.test(s)) s = "'" + s;   // 表計算ソフトで数式として解釈されないように
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvLine = arr => arr.map(csvCell).join(',');
const PLAN_HEAD = ['月', '区分', '項目', '名義', '口座・支払い方法', '金額', '済', 'メモ'];
function planToCSV() {
  const lines = [csvLine(PLAN_HEAD)];
  for (const k of Object.keys(state.months).sort()) {
    const m = state.months[k];
    for (const s of SECTIONS) for (const i of m[s.key]) lines.push(csvLine([k, s.label, i.name, i.owner, viaName(s.key, i.via), i.amount, i.done ? '済' : '', i.memo]));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}
const TX_HEAD = ['日付', '項目', '金額', 'メモ'];
function txToCSV() {
  const lines = [csvLine(TX_HEAD)];
  state.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => lines.push(csvLine([t.date, t.item, t.amount, t.memo])));
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function normDate(s) {
  const m = toHalf(String(s).trim()).match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3], dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? y + '-' + pad(mo) + '-' + pad(d) : null;
}
function normMonth(s) {
  const m = toHalf(String(s).trim()).match(/^(\d{4})[-\/.年](\d{1,2})月?$/);
  return m && +m[2] >= 1 && +m[2] <= 12 ? m[1] + '-' + pad(+m[2]) : null;
}
const unquote = s => String(s || '').trim().replace(/^'(?=[=+\-@])/, '');
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function readText(file) {
  let text = await file.text();
  if (text.includes('�')) { try { text = new TextDecoder('shift_jis').decode(await file.arrayBuffer()); } catch (e) { /* ignore */ } }
  return text;
}

$('fileJson').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let obj; try { obj = JSON.parse(await file.text()); } catch (err) { toast('JSONファイルを読み込めませんでした'); return; }
  const data = obj && obj.data ? obj.data : obj;
  if (!data || (!data.months && !Array.isArray(data.tx))) { toast('この家計簿のバックアップではないようです'); return; }
  const next = normalizeState(data);
  const ok = await confirmDanger('バックアップから復元しますか？', '計画 ' + Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件・記録 ' + next.tx.length + '件を復元します。\n今のデータはすべて置き換わります。', '復元する');
  if (!ok) return;
  state = next; save();
  toast('復元しました'); showView('plan');
});

$('fileCsv').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const rows = parseCSV(await readText(file));
  if (rows.length < 2) { toast('CSVに中身がありません'); return; }
  const head = rows[0].map(h => h.trim());
  const col = n => head.indexOf(n);
  if (col('区分') >= 0 && col('月') >= 0) return importPlanCSV(rows, col);
  if (col('日付') >= 0 && col('金額') >= 0) return importTxCSV(rows, col);
  await ask('読み込めませんでした', '1行目の見出しが違います。\n計画：' + PLAN_HEAD.join(',') + '\n記録：' + TX_HEAD.join(','), [{ label: 'OK', value: true }]);
});
async function importTxCSV(rows, col) {
  const iD = col('日付'), iI = col('項目') >= 0 ? col('項目') : col('カテゴリ'), iA = col('金額'), iM = col('メモ'), iT = col('種別');
  const list = []; let bad = 0;
  for (const r of rows.slice(1)) {
    if (iT >= 0 && (r[iT] || '').trim() === '収入') continue;
    const date = normDate(r[iD] || ''), amount = parseAmount(r[iA] || '');
    if (!date || !Number.isFinite(amount) || amount <= 0) { bad++; continue; }
    list.push({ id: uid(), date, amount, item: unquote(iI >= 0 ? r[iI] : '') || 'その他', memo: unquote(iM >= 0 ? r[iM] : '') });
  }
  if (!list.length) { toast('読み込める行がありませんでした'); return; }
  const sig = t => [t.date, t.item, t.amount, t.memo].join('\u0001');
  const have = new Set(state.tx.map(sig));
  const fresh = list.filter(t => !have.has(sig(t)));
  const ok = await ask('使ったお金の記録を読み込みます', list.length + '件見つかりました。' + (bad ? '（読めなかった行 ' + bad + '件）' : '') + '\nすでにある記録と全く同じ ' + (list.length - fresh.length) + '件は除いて、' + fresh.length + '件を追加します。', [{ label: '追加する', value: true, cls: 'primary' }, { label: 'やめる', value: false }]);
  if (!ok) return;
  state.tx.push(...fresh); save(); toast(fresh.length + '件を追加しました'); render();
}
async function importPlanCSV(rows, col) {
  const iMo = col('月'), iS = col('区分'), iN = col('項目'), iO = col('名義'), iV = col('口座・支払い方法'), iA = col('金額'), iDone = col('済'), iMe = col('メモ');
  const secByLabel = Object.fromEntries(SECTIONS.map(s => [s.label, s.key]));
  const byMonth = {}; let bad = 0;
  for (const r of rows.slice(1)) {
    const mk = normMonth(r[iMo] || ''), sk = secByLabel[(r[iS] || '').trim()];
    const amt = (r[iA] || '').trim() === '' ? 0 : parseAmount(r[iA]);
    if (!mk || !sk || !Number.isFinite(amt)) { bad++; continue; }
    (byMonth[mk] = byMonth[mk] || []).push({ sk, name: unquote(r[iN]), owner: unquote(iO >= 0 ? r[iO] : ''), viaName: unquote(iV >= 0 ? r[iV] : ''), amount: amt, done: iDone >= 0 && /^(済|true|1|✓|○)$/i.test((r[iDone] || '').trim()), memo: unquote(iMe >= 0 ? r[iMe] : '') });
  }
  const months = Object.keys(byMonth).sort();
  if (!months.length) { toast('読み込める行がありませんでした'); return; }
  const exist = months.filter(k => state.months[k]);
  const ok = await ask('計画を読み込みます', months.length + 'か月分（' + monthLabel(months[0]) + '〜' + monthLabel(months[months.length - 1]) + '）が見つかりました。' + (bad ? '\n（読めなかった行 ' + bad + '件）' : '') + (exist.length ? '\nすでにある ' + exist.length + 'か月分は、読み込んだ内容で置き換わります（口座の移動はそのまま）。' : ''), [{ label: '読み込む', value: true, cls: 'primary' }, { label: 'やめる', value: false }]);
  if (!ok) return;
  const findAcc = name => state.accounts.find(a => accountLabel(a) === name || a.name === name);
  const findMe = name => state.methods.find(m => m.name === name);
  for (const mk of months) {
    const m = state.months[mk] || { income: [], fixed: [], saving: [], variable: [], moves: {}, memo: '' };
    for (const s of SECTIONS) m[s.key] = [];
    for (const r of byMonth[mk]) {
      let via = '';
      if (r.viaName) {
        if (r.sk === 'income') { let a = findAcc(r.viaName); if (!a) { a = { id: 'a_' + uid(), name: r.viaName, owner: '' }; state.accounts.push(a); } via = a.id; }
        else { let me = findMe(r.viaName); if (!me) { me = { id: 'm_' + uid(), name: r.viaName, accountId: '', cash: r.viaName === '手持ち' }; state.methods.push(me); } via = me.id; }
      }
      if (r.owner && !state.owners.includes(r.owner)) state.owners.push(r.owner);
      m[r.sk].push({ id: uid(), name: r.name, owner: r.owner, via, amount: r.amount, done: r.done, memo: r.memo });
    }
    state.months[mk] = m;
  }
  save(); toast(months.length + 'か月分を読み込みました'); render();
}

/* =========================================================
   シート（下から出る画面）・確認・トースト
   ========================================================= */
let sheetResolve = null;
function openSheet(title, bodyHtml) {
  if (sheetResolve) { const r = sheetResolve; sheetResolve = null; r(undefined); }
  $('modal').innerHTML = '<h3 id="modalTitle">' + esc(title) + '</h3>' + bodyHtml;
  $('modalBack').classList.add('open');
}
function closeSheet(val) {
  $('modalBack').classList.remove('open');
  if (sheetResolve) { const r = sheetResolve; sheetResolve = null; r(val); }
}
$('modalBack').addEventListener('click', e => { if (e.target === $('modalBack')) closeSheet(undefined); });
function ask(title, text, buttons) {
  return new Promise(resolve => {
    openSheet(title, '<p>' + esc(text) + '</p><div class="btn-col" id="askBtns"></div>');
    sheetResolve = resolve;
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'btn' + (b.cls ? ' ' + b.cls : ''); el.textContent = b.label;
      el.addEventListener('click', () => closeSheet(b.value));
      $('askBtns').appendChild(el);
    });
  });
}
function confirmDanger(title, text, label) {
  return ask(title, text, [{ label: label || '削除する', value: true, cls: 'danger' }, { label: 'やめる', value: false }]).then(v => v === true);
}
function attachAmountFormatter(inp, allowNeg) {
  inp.addEventListener('input', () => {
    const raw = toHalf(inp.value);
    const neg = allowNeg && /^\s*-/.test(raw);
    const digits = raw.replace(/[^\d]/g, '');
    if (!digits) { inp.value = neg ? '-' : ''; return; }
    inp.value = (neg ? '-' : '') + nf.format(parseInt(digits, 10));
  });
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* =========================================================
   起動
   ========================================================= */
applyTheme(getTheme());
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* プレビュー環境などでは登録しない */ });
}
</script>
