<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<meta name="description" content="入ってくるお金を、どの口座にいくら分けるかを決める家計簿">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- フォント：Google Fonts。文字は Noto Sans JP（Regular 400・Medium 500・SemiBold 600）、数字は Barlow（DIN 2014 は Google Fonts にないため、DIN に近い Barlow を数字と記号だけ読み込む） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&text=0123456789%2C.%C2%A5-%E2%88%92%2B%25&display=swap">
<style>
/* iOS のシステムカラーと背景にそろえる */
:root {
  color-scheme: light;
  --bg: #f2f2f7; --card: #ffffff; --sheet-bg: #f2f2f7; --sheet-card: #ffffff;
  --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29); --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.2); --pressed: rgba(0,0,0,.06);
  --blue: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500; --pink: #ff2d55; --indigo: #5856d6; --gray: #8e8e93;
  --purple: #af52de; --teal: #30b0c7; --cyan: #32ade6; --mint: #00c7be; --yellow: #ffcc00; --brown: #a2845e;
  --bar: rgba(249,249,249,.82); --bar-line: rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
    --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.08);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --pink: #ff375f; --indigo: #5e5ce6; --gray: #8e8e93;
  --purple: #bf5af2; --teal: #40c8e0; --cyan: #64d2ff; --mint: #63e6e2; --yellow: #ffd60a; --brown: #ac8e68;
    --bar: rgba(22,22,24,.8); --bar-line: rgba(255,255,255,.15);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --sheet-bg: #1c1c1e; --sheet-card: #2c2c2e;
  --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.32); --pressed: rgba(255,255,255,.08);
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --pink: #ff375f; --indigo: #5e5ce6; --gray: #8e8e93;
  --purple: #bf5af2; --teal: #40c8e0; --cyan: #64d2ff; --mint: #63e6e2; --yellow: #ffd60a; --brown: #ac8e68;
  --bar: rgba(22,22,24,.8); --bar-line: rgba(255,255,255,.15);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--label);
  font-family: "Barlow", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  font-weight: 400; font-size: 17px; line-height: 1.4; letter-spacing: .01em;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
.num { font-variant-numeric: tabular-nums; }
.ms { width: 1.2em; height: 1.2em; fill: currentColor; flex: none; }

/* 上の帯（すりガラス） */
.nav { position: sticky; top: 0; z-index: 20; height: calc(44px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0; display: flex; align-items: center; justify-content: space-between;
  background: transparent; transition: background .2s; }
.nav.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--bar-line); }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
.nav.scrolled .nav-title { opacity: 1; }
.nav-left, .nav-right { display: flex; align-items: center; gap: 2px; min-width: 80px; }
.nav-right { justify-content: flex-end; }
.text-btn { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 8px; border-radius: 8px; min-height: 44px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--blue); display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon-btn .ms { width: 28px; height: 28px; }
.icon-btn.small { width: 36px; height: 36px; }
.icon-btn.small .ms { width: 22px; height: 22px; }
.icon-btn:disabled { color: var(--label3); }
.text-btn:active, .icon-btn:active { opacity: .4; }

main { max-width: 600px; margin: 0 auto; overflow-x: clip; }
html, body { overflow-x: hidden; }
.view { display: none; }
.view.active { display: block; }
.view.slide-l { animation: slideL .28s cubic-bezier(.2,.8,.2,1); }
.view.slide-r { animation: slideR .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slideL { from { transform: translateX(30px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-30px); opacity: .3; } to { transform: none; opacity: 1; } }

/* 大きい題名 */
.large-title { padding: 0 20px 6px; }
.large-title h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }
.lt-sub { font-size: 15px; color: var(--label2); }

/* のこり（いちばん大事な数字） */
.hero { text-align: center; padding: 10px 16px 22px; }
.hero .cap { font-size: 15px; color: var(--label2); }
.hero .big { font-size: 48px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.hero .big.neg { color: var(--red); }
.hero .cap2 { font-size: 13px; color: var(--label2); margin-top: 6px; }
.hero.small { padding: 6px 16px 18px; }
.hero.small .big { font-size: 40px; }
.hero.small .tile { width: 44px; height: 44px; border-radius: 11px; margin: 0 auto 8px; }
.hero.small .tile .ms { width: 28px; height: 28px; }
.pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 5px 12px; border-radius: 999px; font-size: 15px; font-weight: 600; }
.pill .ms { width: 18px; height: 18px; }
.pill.neg { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.pill.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.empty-state { text-align: center; color: var(--label2); padding: 24px 20px 8px; }

/* まとまり（角丸のリスト） */
.group { margin: 0 16px 24px; background: var(--card); border-radius: 12px; overflow: hidden; }
.sheet .group { background: var(--sheet-card); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 32px 7px; font-size: 13px; color: var(--label2); }
.group-foot { margin: -17px 32px 24px; font-size: 13px; color: var(--label2); line-height: 1.4; }
.head-btn { background: none; border: 0; color: var(--blue); font-size: 15px; padding: 0; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 16px; width: 100%; border: 0; background: transparent; text-align: left; font-size: 17px; }
.cell::before { content: ''; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 1px; background: var(--sep); transform: scaleY(.5); transform-origin: top; }
.group > .cell:first-child::before, .group > .swipe:first-child .cell::before, .group > label.cell:first-child::before { display: none; }
.cell:has(.tile) { --inset: 57px; }
.cell.acc { --inset: 99px; padding-left: 8px; gap: 4px; }
.cell.link:active, .acc-open:active { background: var(--pressed); }
.cell .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cell .title { font-size: 17px; }
.cell .title.blue { color: var(--blue); }
.cell .title.red { color: var(--red); }
.cell .sub { font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.cell .sub-only { color: var(--label2); }
.cell .value { color: var(--label2); white-space: nowrap; }
.cell .value.strong { color: var(--label); font-weight: 500; }
.cell .value.zero { color: var(--label3); }
.cell .verb { font-size: 15px; color: var(--label2); white-space: nowrap; }
.chev { width: 20px; height: 20px; fill: var(--label3); margin-right: -6px; }
.chev-space { width: 14px; flex: none; }
.center-cell { justify-content: center; }
.add-ic { width: 26px; height: 26px; fill: var(--green); }
.add-cell { --inset: 54px; }
.code-box { width: 100%; border: 0; background: transparent; padding: 12px 16px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.4; resize: vertical; outline: none; color: var(--label); word-break: break-all; }
.center-text { text-align: center; }
.seg { display: flex; width: 100%; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; min-height: 36px; font-size: 13px; padding: 4px 2px; color: var(--label); line-height: 1.2; }
.seg button[aria-checked="true"] { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.12); font-weight: 500; }
.seg-cell { flex-direction: column; align-items: stretch; gap: 10px; }
.seg-cell .sub { white-space: normal; }
.badge.wd { color: #fff; background: var(--green); }
.cell .value.wd { color: var(--green); }
.cover-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: var(--green); box-shadow: 0 4px 12px rgba(52,199,89,.3); cursor: pointer; }
.cover-btn .ms { width: 18px; height: 18px; fill: #fff; }
.badge.warn { color: #fff; background: var(--orange); }
.pend { color: var(--orange); font-weight: 600; margin-right: 4px; }
.pend-line { margin-top: 10px; font-size: 14px; color: var(--orange); font-weight: 500; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); border-radius: 6px; padding: 1px 6px; vertical-align: 2px; }

/* 色付きの角丸アイコン（iPhone の設定アプリと同じ形） */
.tile { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
.tile .ms { width: 20px; height: 20px; fill: #fff; }

/* 口座の行 */
.acc-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 6px 0; text-align: left; min-height: 56px; border-radius: 8px; }
.ring { flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.ring .ms { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--label3); fill: transparent; padding: 3px; box-sizing: border-box; transition: background .15s, border-color .15s; }
.ring[aria-checked="true"] .ms { background: var(--blue); border-color: var(--blue); fill: #fff; }
.ring-space { width: 44px; flex: none; }
.cell.acc.is-done .value.strong { color: var(--label2); text-decoration: line-through; }

/* スワイプ */
.swipe { position: relative; overflow: hidden; touch-action: pan-y; }
.swipe-content { position: relative; background: inherit; z-index: 1; will-change: transform; }
.group .swipe-content { background: var(--card); }
.sheet .group .swipe-content { background: var(--sheet-card); }
.swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; visibility: hidden; }
.swipe.moving .swipe-actions, .swipe.open .swipe-actions { visibility: visible; }
.sw-btn { border: 0; color: #fff; min-width: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; padding: 0 12px; }
.sw-btn .ms { width: 22px; height: 22px; fill: #fff; }
.sw-btn.green { background: var(--green); }
.sw-btn.gray { background: var(--gray); }
.sw-btn.red { background: var(--red); }

/* 入力の行（左に名前、右に値） */
.cell.form { gap: 12px; }
.cell.form .label { flex: none; min-width: 84px; display: flex; flex-direction: column; }
.cell.form .label small { font-size: 12px; color: var(--label2); }
.cell.form.icon .label { flex: 1; }
.cell.form input { flex: 1; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 17px; padding: 6px 0; outline: none; color: var(--label); }
.cell.form.icon input { flex: 0 1 140px; }
.cell.form input::placeholder { color: var(--label3); }
.cell .unit { color: var(--label2); }
.picker { cursor: pointer; }
.picker .picked { flex: 1; text-align: right; color: var(--label2); }
.picker select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }

/* iOS のスイッチ */
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }

/* 大きいボタン */
.pad { padding: 0 16px 24px; }
.save-pad { padding-top: 4px; }
.big-btn { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.big-btn.done { background: var(--fill); color: var(--green); }
.big-btn .ms { width: 22px; height: 22px; }
.big-btn:active { opacity: .7; }

/* 金額だけ変える画面 */
.sheet-lead { margin: 4px 32px 14px; font-size: 15px; color: var(--label2); }
.sheet-lead.center { text-align: center; }
.amount-big { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin: 0 16px; }
.amount-big .yen { font-size: 32px; font-weight: 600; color: var(--label2); }
.amount-big input { width: 2ch; max-width: calc(100vw - 80px); border: 0; background: transparent; font-size: 52px; font-weight: 600; text-align: center; outline: none; padding: 0; color: var(--label); }
.amount-big input::placeholder { color: var(--label3); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 16px 24px; }
.chip { border: 0; background: var(--fill); color: var(--blue); border-radius: 999px; padding: 8px 14px; font-size: 15px; min-height: 36px; }
.chip:active { opacity: .6; }

/* シート */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet-back.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; height: calc(100% - 44px - env(safe-area-inset-top)); z-index: 41; background: var(--sheet-bg); border-radius: 12px 12px 0 0;
  transform: translateY(105%); transition: transform .38s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; box-shadow: 0 -2px 20px rgba(0,0,0,.12); }
.sheet:not(.open) { visibility: hidden; transition: transform .38s cubic-bezier(.32,.72,0,1), visibility 0s .38s; }
.sheet.open { transform: translateY(0); visibility: visible; }
.sheet-grip { flex: none; padding: 6px 8px 4px; touch-action: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 0 auto 4px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head .text-btn:last-child { justify-self: end; font-weight: 600; }
.sheet-head .text-btn:first-child { justify-self: start; }
.sheet-head .text-btn.icon-only .ms { width: 26px; height: 26px; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sheet-body.fade { animation: fadeIn .22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* アクションシート（確認） */
.action-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.action-back.open { opacity: 1; pointer-events: auto; }
.action-box { width: 100%; max-width: 600px; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); transform: translateY(30px); transition: transform .25s cubic-bezier(.32,.72,0,1); }
.action-back.open .action-box { transform: none; }
.as-group { background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; margin-top: 8px; }
.as-group:last-child { background: var(--card); }
.as-msg { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label2); display: flex; flex-direction: column; gap: 4px; }
.as-msg b { font-weight: 600; }
.as-btn { display: block; width: 100%; min-height: 57px; border: 0; background: none; color: var(--blue); font-size: 20px; border-top: .5px solid var(--sep); }
.as-btn.red { color: var(--red); }
.as-btn.bold { font-weight: 600; border-top: 0; }
.as-btn:active { background: var(--pressed); }

/* 下のタブ（すりガラス） */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 -.5px 0 var(--bar-line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: grid; grid-template-columns: 1fr 1fr 1fr; max-width: 600px; margin: 0 auto; padding: 0; list-style: none; }
.tabbar button { width: 100%; height: 50px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; color: var(--gray); }
.tabbar button .ms { width: 26px; height: 26px; }
.tabbar button .ms.on, .tabbar button[aria-current="page"] .ms:not(.on) { display: none; }
.tabbar button[aria-current="page"] .ms.on { display: block; }
.tabbar button[aria-current="page"] { color: var(--blue); }

/* お知らせ */
.toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 70; background: rgba(30,30,32,.92); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px;
  display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity .2s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: none; color: #64d2ff; font-weight: 600; font-size: 15px; padding: 0; white-space: nowrap; }

/* ===== グラスモーフィズム：色のついた背景の上に、すりガラスのパネルを重ねる ===== */
:root {
  --page: #eef1f8;
  --blob1: rgba(10,132,255,.48); --blob2: rgba(175,82,222,.40); --blob3: rgba(255,55,95,.30); --blob4: rgba(48,209,88,.30);
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.86); --glass-solid: rgba(255,255,255,.94);
  --glass-line: rgba(255,255,255,.75); --glass-shadow: 0 10px 30px rgba(40,50,110,.12), inset 0 1px 0 rgba(255,255,255,.6);
  --label2: rgba(40,40,50,.66);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #06070c;
    --blob1: rgba(10,132,255,.42); --blob2: rgba(175,82,222,.36); --blob3: rgba(255,55,95,.26); --blob4: rgba(48,209,88,.20);
    --glass: rgba(40,40,48,.45); --glass-strong: rgba(30,30,36,.84); --glass-solid: rgba(44,44,50,.96);
    --glass-line: rgba(255,255,255,.14); --glass-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);

}
.group { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--glass-shadow); }

/* ===== 余白を広げる ===== */
.large-title { padding: 6px 24px 16px; }

:root[data-theme="dark"] { --cv-fixed: #3987e5; --cv-living: #d95926; --cv-saving: #199e70; --cv-income: #9085e9; --cv-wd: #c98500; --cv-neutral: #5d5c57; --cv-grid: #2c2c2a; --cv-base: #383835; }
.cv-card { padding: 16px 16px 12px; }

/* ===== まとめ（収支・振り分け） ===== */

/* ===== 口座移動の色分け：出す＝赤、入れる＝緑 ===== */
.mv-group { position: relative; }

.pend-btn .ms { width: 18px; height: 18px; fill: #fff; }
</style>
</head>

<script>
'use strict';
/* =========================================================

const STORAGE_KEY = 'kakeibo.v2';
const APP_VERSION = '2026.11.24-18';

      for (const i of bd) nm.out.push({ id: String(i.id || uid()), name: String(i.name), acc: String(cid), amount: int(i.amount), memo: String(i.memo || ''), fixed: true, cat: i._cat });
      const rest = bill ? int(bill.amount) - sum(bd.map(i => int(i.amount))) : 0;
      if (bill && rest !== 0) nm.out.push({ id: String(bill.id || uid()), name: String(card.name) + (bd.length ? '（ほか）' : ''), acc: String(cid), amount: rest, memo: String(bill.memo || ''), fixed: true, cat: 'variable' });
    }
    for (const [aid, mv] of Object.entries(m.moves || {})) if (mv && mv.done) nm.done[aid] = true;
    out.months[mk] = nm;
  }
  return out;
}

/* =========================================================
   小さな道具
   ========================================================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const dateKey = d => monthKey(d) + '-' + pad(d.getDate());
function addMonths(mk, n) { const [y, m] = mk.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function monthLabel(mk) { const [y, m] = mk.split('-').map(Number); return y + '年' + m + '月'; }
const nf = new Intl.NumberFormat('ja-JP');
const yenFmt = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' });
const yenSFmt = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', signDisplay: 'exceptZero' });
const pctFmt = new Intl.NumberFormat('ja-JP', { style: 'percent', maximumFractionDigits: 1 });
const manFmt = new Intl.NumberFormat('ja-JP', { notation: 'compact', maximumFractionDigits: 1, signDisplay: 'exceptZero' });
const yen = n => yenFmt.format(Math.round(n) || 0);          // ￥1,000 / -￥1,000
const yenS = n => yenSFmt.format(Math.round(n) || 0);        // +￥1,000 / -￥1,000（増えるか減るかを出す）
const pct = v => pctFmt.format(Number.isFinite(v) ? v : 0);
const sum = arr => arr.reduce((a, b) => a + b, 0);
function toHalf(s) { return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー−]/g, '-'); }
function parseAmount(str) { const s = toHalf(str).replace(/[,，\s円¥￥+]/g, ''); return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInput = n => n ? (n < 0 ? '-' : '') + nf.format(Math.abs(n)) : '';
const accountById = id => state.accounts.find(a => a.id === id);
// 来月の扱い（項目ごとに選ぶ）：同じ額／額が変わる（金額を空に）／今月だけ
const repOf = i => i.repeat === 'once' || i.fixed === false ? 'once' : i.repeat === 'vary' ? 'vary' : 'same';
const REPEATS = [['same', '同じ額', '来月も同じ金額で入ります'], ['vary', '額が変わる', '来月は項目だけ入ります（金額は空にして「金額を入れる」の印）'], ['once', '今月だけ', '来月には入りません']];

/* =========================================================
   計算：入ってくる − 分ける ＝ のこり
   ========================================================= */
// 口座に入れる額は、設定した単位（初期は1,000円）で繰り上げる
function roundUp(v) { const u = state.roundUnit || 0; return u && v > 0 ? Math.ceil(v / u) * u : v; }
function balanceOf(m) {
  const inc = sum(m.income.map(i => i.amount));
  const S = id => sum(m.out.filter(i => catOf(i) === id).map(amt));
  const fixed = S('fixed'), living = S('living'), saving = S('saving');
  const surplus = inc - fixed - living;                     // ＋なら黒字、−なら赤字
  return { inc, fixed, living, saving, surplus, rate: inc ? surplus / inc : 0 };
}
// 目安（手取りに対して）：50/30/20 ルールを当てはめたもの
const GUIDE = { fixed: 0.5, living: 0.3, save: 0.2 };
function balanceHero(m, noRest) {
  const b = balanceOf(m), t = totals(m), black = b.surplus >= 0;
  return '<section class="hero num bal">' +
    '<div class="bal-tag ' + (black ? 'black' : 'red') + '">' + ic(black ? 'check_circle-fill' : 'warning-fill') + (black ? '黒字' : '赤字') + '</div>' +
    '<div class="big' + (black ? '' : ' neg') + '">' + yenS(b.surplus) + '</div>' +
    '<div class="stats' + (noRest ? ' one' : '') + '"><div><span>貯金率</span><b class="' + (b.rate >= GUIDE.save ? 'ok' : b.rate < 0 ? 'ng' : '') + '">' + pct(b.rate) + '</b></div>' +
    (noRest ? '' : '<div><span>振り分けのこり</span><b class="' + (t.rest < 0 ? 'ng' : t.rest === 0 ? 'ok' : '') + '">' + yen(t.rest) + '</b></div>') + '</div>' +
    (t.rest < 0 ? '<div><button class="cover-btn" id="coverBtn">' + ic('savings-fill') + '貯金から出して補う</button></div>' : '') + '</section>';
}
function totals(m) {
  const inc = sum(m.income.map(i => i.amount));
  const out = sum(rowsOf(m).map(r => r.send));
  return { inc, out, rest: inc - out };
}
// 払うものが、実際にどの口座から出るか（カードなら引き落とし口座）。決まっていなければ null
function payAccOf(i) {
  const a = accountById(i.acc);
  if (!a) return null;
  if (a.kind !== 'card') return a;
  const p = accountById(a.payFrom);
  return p && p.kind !== 'card' ? p : null;
}
const isCard = a => !!a && a.kind === 'card';
const cardsOf = accId => state.accounts.filter(c => c.kind === 'card' && c.payFrom === accId);
// 払うものの「どこから」を短く：「楽天カード払い」「夫ゆうちょから」
function payLabel(i) {
  const a = accountById(i.acc);
  if (!a) return '口座が決まっていない';
  return a.name;   // 口座（カード）の名前だけ
}
function rowsOf(m) {
  const rows = state.accounts.filter(a => a.kind !== 'card').map(a => {
    const items = m.out.filter(i => { const p = payAccOf(i); return !!p && p.id === a.id; });
    const keep = m.income.some(i => i.acc === a.id);
    const total = sum(items.map(amt));
    const left = (m.left || {})[a.id] || 0;              // 先月から口座に残っている額
    // 合計がマイナス＝貯金から出す（そのまま出す。繰り上げない）
    const send = total < 0 ? total : roundUp(Math.max(0, total - left));
    return { a, items, total, left, send, verb: send < 0 ? 'から出す' : a.kind === 'cash' ? '現金でおろす' : keep ? 'に残しておく' : 'に入れる' };
  }).filter(r => r.items.length);
  const lost = m.out.filter(i => !payAccOf(i));
  if (lost.length) { const total = sum(lost.map(amt)); rows.push({ a: { id: '', name: '口座が決まっていない', kind: 'none' }, items: lost, total, left: 0, send: total, verb: '' }); }
  return rows;
}

/* =========================================================
   月：なければ前の月をコピーして作る
   ========================================================= */
function latestMonthBefore(mk) { const k = Object.keys(state.months).filter(x => x < mk).sort(); return k.length ? k[k.length - 1] : null; }
function copyMonth(mk, from) {
  const src = state.months[from];
  // 毎月同じ額 → 金額ごとコピー／毎月・額が変わる → 項目だけコピー（金額は空）／今月だけ → コピーしない
  const cp = arr => arr.filter(i => repOf(i) !== 'once').map(i => { const vary = repOf(i) === 'vary'; return { ...i, id: uid(), amount: vary ? 0 : i.amount, pending: vary }; });
  state.months[mk] = src ? { income: cp(src.income), out: cp(src.out), done: {}, left: {} } : { income: [], out: [], done: {}, left: {} };
  save();
}

}

/* ---------- グラフ ---------- */
// 色はグラフ用の決まった並び（固定費・生活費・貯金&積立・収入・貯金から出す）。ダークモードは別の段を使う
function renderGraph() {
  const box = $('view-graph');
  const [y, mo] = viewMonth.split('-').map(Number);
  const m = state.months[viewMonth];
  if (!m) return emptyMonth(box);
  const b = balanceOf(m);
  // 1) 収入に対する割合（目安の線つき）
  const ratioRow = (label, v, guide, kind, color) => {
    const ok = kind === 'max' ? v <= guide : v >= guide;
    const w = Math.max(0, Math.min(1, v)) * 100;
    return '<div class="rt">' +
      '<div class="rt-head"><span class="rt-l">' + label + '</span><span class="rt-v num' + (v < 0 ? ' ng' : '') + '">' + pct(v) + '</span></div>' +
      '<div class="rt-bar"><div class="rt-fill" style="width:' + w + '%;background:' + color + '"></div><div class="rt-mark" style="left:' + guide * 100 + '%"></div></div>' +
      '<div class="rt-guide ' + (ok ? 'ok' : 'ng') + '">' + ic(ok ? 'check_circle-fill' : 'warning-fill') + '目安 ' + pct(guide) + (kind === 'max' ? ' 以内' : ' 以上') + '</div></div>';
  };
  const inc = b.inc || 1;
  const card1 = '<div class="group-head"><span>収入に対する割合</span></div><div class="group cv-card">' +
    ratioRow('固定費', b.fixed / inc, GUIDE.fixed, 'max', 'var(--cv-fixed)') +
    ratioRow('生活費', b.living / inc, GUIDE.living, 'max', 'var(--cv-living)') +
    ratioRow('貯金率', b.rate, GUIDE.save, 'min', 'var(--cv-saving)') + '</div>';
  // 2) 月ごとの黒字・赤字（0を真ん中にした棒。目盛りは1つ）
  const months = Object.keys(state.months).filter(k => k <= viewMonth).sort().slice(-6);
  const data = months.map(k => ({ k, v: balanceOf(state.months[k]).surplus }));
  const maxA = Math.max(1, ...data.map(d => Math.abs(d.v)));
  const W = 340, H = 220, top = 24, bottom = 196, zero = (top + bottom) / 2, half = (bottom - top) / 2;
  const gw = W / Math.max(1, data.length), bw = Math.min(36, gw * 0.55);
  let g = '<line x1="0" x2="' + W + '" y1="' + zero + '" y2="' + zero + '" class="cv-base"/>';
  data.forEach((d, k) => {
    const cx = gw * k + gw / 2, h = Math.abs(d.v) / maxA * (half - 18), up = d.v >= 0;
    const y0 = up ? zero - h : zero;
    g += '<rect class="cv-mark" x="' + (cx - bw / 2).toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="4" fill="' + (up ? 'var(--cv-good)' : 'var(--cv-bad)') + '" data-tip="' + esc(monthLabel(d.k) + ' ' + (up ? '黒字 ' : '赤字 ') + yenS(d.v)) + '"/>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (up ? y0 - 6 : y0 + h + 14).toFixed(1) + '" class="cv-v2" text-anchor="middle">' + manFmt.format(Math.round(d.v)) + '</text>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (H - 4) + '" class="cv-ax" text-anchor="middle">' + Number(d.k.slice(5)) + '月</text>';
  });
  const card2 = '<div class="group-head"><span>月ごとの黒字・赤字</span></div><div class="group cv-card"><svg class="cv" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月ごとの黒字と赤字">' + g + '</svg></div>';
  // 3) 使いすぎ トップ3：直前3か月の平均より増えた額が大きい順（貯金&積立・貯金から出す分は使ったお金ではないので外す）
  const prevKeys = Object.keys(state.months).filter(k => k < viewMonth).sort().slice(-3);
  const spentOf = (mm, name) => sum(mm.out.filter(i => i.name === name && catOf(i) !== 'saving' && !i.withdraw).map(i => i.amount));
  const names = [...new Set(m.out.filter(i => catOf(i) !== 'saving' && !i.withdraw && i.amount > 0).map(i => i.name))];
  const over = names.map(name => {
    const now = spentOf(m, name);
    const avg = prevKeys.length ? sum(prevKeys.map(k => spentOf(state.months[k], name))) / prevKeys.length : 0;
    const it = m.out.find(i => i.name === name);
    return { name, now, avg, up: now - avg, cat: catOf(it) };
  }).filter(x => prevKeys.length ? x.up > 0 : true).sort((p, q) => (prevKeys.length ? q.up - p.up : q.now - p.now)).slice(0, 3);
  const maxUp = Math.max(1, ...over.map(x => prevKeys.length ? x.up : x.now));
  const card3 = '<div class="group-head"><span>使いすぎ トップ3</span><span>' + (prevKeys.length ? '直前' + prevKeys.length + 'か月の平均と比べて' : '金額の大きい順') + '</span></div><div class="group cv-card">' +
    (over.length ? over.map((x, k) => '<div class="rk">' +
      '<span class="rk-n rk-' + (k + 1) + ' num">' + (k + 1) + '</span>' +
      '<div class="rk-body"><div class="rk-head"><span class="rk-name">' + esc(x.name) + '</span><span class="rk-now num">' + yen(x.now) + '</span></div>' +
      '<div class="rk-bar"><div style="width:' + ((prevKeys.length ? x.up : x.now) / maxUp * 100).toFixed(1) + '%;background:var(--cv-' + x.cat + ')"></div></div>' +
      (prevKeys.length ? '<div class="rk-sub num">' + (x.avg ? '平均 ' + yen(x.avg) + ' → ' + yenS(x.up) + '（' + pct(x.up / x.avg) + '増）' : '新しく増えた ' + yenS(x.up)) + '</div>' : '') +
      '</div></div>').join('') : '<div class="rk-none">' + ic('check_circle-fill') + '使いすぎはありません</div>') + '</div>';
  box.innerHTML = largeTitle(mo + '月', y + '年') + monthSeg() + balanceHero(m) + card3 + card1 + card2 + '<div class="cv-tip" id="cvTip" role="status"></div>';
  if ($('coverBtn')) $('coverBtn').addEventListener('click', () => coverFromSavings(-totals(m).rest));
  // タップ（マウスなら乗せる）で金額を出す
  const tip = $('cvTip');
  const show = (el, e) => { tip.textContent = el.dataset.tip; tip.classList.add('show'); const r = box.getBoundingClientRect(); const er = el.getBoundingClientRect(); const px = (e && e.clientX ? e.clientX : er.left + er.width / 2) - r.left; const py = er.top - r.top; tip.style.left = Math.max(8, Math.min(r.width - 8 - tip.offsetWidth, px - tip.offsetWidth / 2)) + 'px'; tip.style.top = (py - 40) + 'px'; };
  box.querySelectorAll('.cv-mark').forEach(el => { el.addEventListener('click', e => { e.stopPropagation(); show(el, e); }); el.addEventListener('mouseenter', e => show(el, e)); el.addEventListener('mouseleave', () => tip.classList.remove('show')); });
  box.addEventListener('click', () => tip.classList.remove('show'));
}

/* ---------- 今月 ---------- */
// 口座移動：口座ごとに「出す（給与・貯金から）」「入れる」「現金でおろす」を、設定の口座の順（スプレッドシートの口座の表と同じ順）で出す
function movesOf(m) {
  const rows = rowsOf(m);
  const unit = state.roundUnit || 0;
  const roundDown = v => unit ? Math.floor(v / unit) * unit : v;
  const list = [];
  for (const a of state.accounts.filter(x => x.kind !== 'card')) {
    const r = rows.find(x => x.a.id === a.id) || null;
    const incoming = sum(m.income.filter(i => i.acc === a.id).map(i => i.amount));
    const keep = r ? Math.max(0, r.send) : 0;                 // この口座に置いておく額
    const wd = r && r.send < 0 ? -r.send : 0;                 // 貯金から出す額
    let dir = '', amount = 0, note = '';
    if (incoming > 0) {
      const net = incoming + wd - keep;
      if (net > 0) { dir = 'out'; amount = roundDown(net); note = (keep ? yen(keep) + ' を残して' : '入ってきた分を') + '出す'; }
      else if (net < 0) { dir = a.kind === 'cash' ? 'cash' : 'in'; amount = -net; note = '入ってくる分では足りない'; }
      else { dir = 'stay'; note = 'そのまま'; }
    } else if (wd) { dir = 'out'; amount = wd; note = '貯金から出す'; }
    else if (keep) { dir = a.kind === 'cash' ? 'cash' : 'in'; amount = keep; }
    else if (r) { dir = 'stay'; note = 'そのまま'; }
    else continue;
    list.push({ a, r, dir, amount, note, incoming });
  }
  const lost = rows.find(x => !x.a.id);
  if (lost) list.push({ a: lost.a, r: lost, dir: 'in', amount: lost.send, note: '口座を選んでください', incoming: 0 });
  return list;
}
const DIR = { out: '出す', in: '入れる', cash: 'おろす', stay: 'そのまま' };
function moveRow(m, mv) {
  const { a, r } = mv;
  const done = !!(a.id && m.done[a.id]);
  const pend = r ? r.items.filter(i => i.pending).length : 0;
  const keep = r ? Math.max(0, r.send) : 0;
  const sub = [mv.dir === 'out' && mv.incoming && keep ? yen(keep) + ' 残す' : '', a.use || ''].filter(Boolean).join('・');
  const cell = '<div class="cell acc' + (done ? ' is-done' : '') + '">' +
    (a.id ? '<button class="ring" role="checkbox" aria-checked="' + done + '" aria-label="' + esc(a.name) + 'の移動をした" data-done-acc="' + a.id + '">' + ic('check') + '</button>' : '<span class="ring-space"></span>') +
    '<button class="acc-open" data-acc="' + a.id + '" data-has-row="' + (r ? 1 : 0) + '">' + accTile(a) +
      '<span class="grow"><span class="title">' + esc(a.name) + '</span><span class="sub">' + (pend ? '<span class="pend">未入力 ' + pend + '件</span>' : '') + esc(sub) + '</span></span>' +
      '<span class="value strong num mv-' + mv.dir + (mv.amount ? '' : ' zero') + '">' + yenS(mv.dir === 'out' ? -mv.amount : mv.amount) + '</span>' + chev() + '</button></div>';
  if (!a.id) return cell;
  return '<div class="swipe" data-acc="' + a.id + '"><div class="swipe-actions"><button class="sw-btn ' + (done ? 'gray' : 'green') + '" data-swipe-done="' + a.id + '">' + ic(done ? 'undo' : 'check') + (done ? '戻す' : '完了') + '</button></div><div class="swipe-content">' + cell + '</div></div>';
}
function renderPlan() {
  const box = $('view-plan');
  const [y, mo] = viewMonth.split('-').map(Number);
  const m = state.months[viewMonth];
  let html = largeTitle(mo + '月', y + '年') + monthSeg();
  if (!m) {
    const prev = latestMonthBefore(viewMonth);
    html += '<div class="empty-state"><p>' + y + '年' + mo + '月の計画はまだありません</p></div><div class="group">' +
      (prev ? '<button class="cell link" id="mkCopy">' + tile('content_copy', 'var(--blue)') + '<span class="grow"><span class="title">' + monthLabel(prev) + 'から作る</span><span class="sub">「今月だけ」以外を入れます。額が変わるものは金額を空にします</span></span>' + chev() + '</button>' : '') +
      '<button class="cell link" id="mkEmpty">' + tile('add', 'var(--gray)') + '<span class="grow"><span class="title">空で作る</span></span>' + chev() + '</button></div>' +
      (Object.keys(state.months).length ? '' : '<div class="group"><button class="cell link" id="mkCode">' + tile('upload', 'var(--indigo)') + '<span class="grow"><span class="title">前のデータを戻す</span><span class="sub">もらったコードを貼り付けます</span></span>' + chev() + '</button></div>');
    box.innerHTML = html;
    if (prev) $('mkCopy').addEventListener('click', () => { copyMonth(viewMonth, prev); render(); });
    $('mkEmpty').addEventListener('click', () => { copyMonth(viewMonth, null); render(); });
    if ($('mkCode')) $('mkCode').addEventListener('click', () => codeRestoreSheet());
    return;
  }
  const t = totals(m);
  const rows = rowsOf(m);
  const moves = movesOf(m);
  const doneN = moves.filter(x => x.a.id && x.dir !== 'stay' && m.done[x.a.id]).length;
  const accN = moves.filter(x => x.a.id && x.dir !== 'stay').length;
  const pendN = [...m.income, ...m.out].filter(i => i.pending).length;
  const incPend = m.income.filter(i => i.pending).length;
  const outSum = sum(moves.filter(x => x.dir === 'out').map(x => x.amount));
  const inSum = sum(moves.filter(x => x.dir === 'in' || x.dir === 'cash').map(x => x.amount));
  const outs = moves.filter(x => x.dir === 'out');
  const ins = moves.filter(x => x.dir === 'in' || x.dir === 'cash');
  html +=
    balanceHero(m, true) + (pendN ? '<div class="center-text pend-btn-wrap"><button class="pend-btn" id="bulkOpen2">' + ic('edit_note') + '未入力 ' + pendN + '件を入れる</button></div>' : '') +
    '<div class="group-head"><span></span><span class="num">' + doneN + ' / ' + accN + ' 完了</span></div>' +
    '<div class="group mv-group out" id="accList">' + outs.map(mv => moveRow(m, mv)).join('') + '</div>' +
    (outs.length && ins.length ? '<div class="flow-arrow" aria-hidden="true">' + ic('arrow_downward') + '</div>' : '') +
    '<div class="group mv-group in">' + ins.map(mv => moveRow(m, mv)).join('') +
      '<button class="cell link add-cell" id="addOut">' + ic('add_circle-fill', 'add-ic') + '<span class="grow"><span class="title blue">払うものを追加</span></span></button>' +
    '</div>' +
    '<div class="group">' +
      '<button class="cell link" id="openLeft">' + tile('savings-fill', 'var(--pink)') + '<span class="grow"><span class="title">先月の余り</span></span><span class="value">' + (rows.some(r => r.left) ? '入力済み' : 'なし') + '</span>' + chev() + '</button>' +
      (latestMonthBefore(viewMonth) ? '<button class="cell link" id="copyPrev">' + tile('content_copy', 'var(--gray)') + '<span class="grow"><span class="title">先月の内容で入れ直す</span></span>' + chev() + '</button>' : '') +
    '</div>';
  box.innerHTML = html;

  if ($('coverBtn')) $('coverBtn').addEventListener('click', () => coverFromSavings(-t.rest));
  if ($('bulkOpen2')) $('bulkOpen2').addEventListener('click', () => bulkSheet());
  box.querySelectorAll('[data-done-acc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toggleDone(m, b.dataset.doneAcc); }));
  box.querySelectorAll('.acc-open').forEach(b => b.addEventListener('click', () => b.dataset.hasRow === '1' ? accountSheet(b.dataset.acc) : incomeSheet()));
  box.querySelectorAll('.swipe[data-acc]').forEach(el => enableSwipe(el));
  box.querySelectorAll('[data-swipe-done]').forEach(b => b.addEventListener('click', () => toggleDone(m, b.dataset.swipeDone)));
  $('addOut').addEventListener('click', () => editItem('out', null, '', null));
  $('openLeft').addEventListener('click', () => leftSheet());
  if ($('copyPrev')) $('copyPrev').addEventListener('click', async () => {
    const prev = latestMonthBefore(viewMonth);
    const ok = await ask('先月の内容で入れ直しますか？', monthLabel(prev) + 'の内容で入れ直します（「額が変わる」ものは金額が空になります）。「今月だけ」のものは消え、完了の印も外れます。', [{ label: '入れ直す', value: true }]);
    if (ok !== true) return;
    copyMonth(viewMonth, prev); render(); toast('入れ直しました');
  });
}
// 足りない分を貯金から出す：積立の「貯金から出す」を、足りない額（1,000円単位で切り上げ）で作る
function coverFromSavings(short) {
  const unit = state.roundUnit || 1;
  const n = Math.ceil(short / unit) * unit;
  const sav = state.accounts.find(a => a.kind !== 'card' && /貯金|貯蓄/.test((a.use || '') + a.name));
  editItem('out', null, sav ? sav.id : '', null, 'saving', { name: '貯金から出す', amount: n, withdraw: true, repeat: 'once' });
}
function toggleDone(m, id) {
  if (m.done[id]) delete m.done[id]; else m.done[id] = true;
  save(); render();
}
function accRow(m, r) {
  const done = !!m.done[r.a.id];
  const pend = r.items.filter(i => i.pending).length;
  const sub = (r.verb ? r.verb.replace(/^(に|から)/, '') + '｜' : '') + (r.left ? '余り ' + yen(r.left) + ' を引いた額・' : '') + (r.a.use || [...new Set(r.items.map(i => isCard(accountById(i.acc)) ? accountById(i.acc).name : i.name))].join('・'));
  const cell = '<div class="cell acc' + (done ? ' is-done' : '') + '">' +
    (r.a.id ? '<button class="ring" role="checkbox" aria-checked="' + done + '" aria-label="' + esc(r.a.name) + 'に分けた" data-done-acc="' + r.a.id + '">' + ic('check') + '</button>' : '<span class="ring-space"></span>') +
    '<button class="acc-open" data-acc="' + r.a.id + '">' + accTile(r.a) +
      '<span class="grow"><span class="title">' + esc(r.a.name) + '</span><span class="sub">' + (pend ? '<span class="pend">未入力 ' + pend + '件</span>' : '') + esc(sub) + '</span></span>' +
      '<span class="value strong num' + (r.send ? '' : ' zero') + (r.send < 0 ? ' wd' : '') + '">' + yen(Math.abs(r.send)) + '</span>' + chev() + '</button></div>';
  if (!r.a.id) return cell;
  return '<div class="swipe" data-acc="' + r.a.id + '"><div class="swipe-actions"><button class="sw-btn ' + (done ? 'gray' : 'green') + '" data-swipe-done="' + r.a.id + '">' + ic(done ? 'undo' : 'check') + (done ? '戻す' : '完了') + '</button></div><div class="swipe-content">' + cell + '</div></div>';
}

/* ---------- 変動する金額をまとめて入力 ----------
   毎月の入力は「額が変わる」ものと未入力のものだけ。定額のものは自動で入る（会計でいう定額の自動仕訳）。
   先月の額を横に出し、大きく変わったものには印を付ける（前月比較で打ち間違いに気づく） */
function bulkTargets(m) {
  return [...m.income.map(i => ['income', i]), ...m.out.map(i => ['out', i])].filter(([, i]) => repOf(i) === 'vary' || i.pending);
}
function bulkSheet() {
  const m = state.months[viewMonth];
  if (!m) return;
  const pm = state.months[latestMonthBefore(viewMonth)];
  const prevOf = (kind, i) => { if (!pm) return null; const p = pm[kind].find(x => x.name === i.name && x.acc === i.acc) || pm[kind].find(x => x.name === i.name); return p ? p.amount : null; };
  const list = bulkTargets(m);
  const secs = [['income', '収入']].concat(CATS.map(c => [c[0], c[1]]));
  const secOf = ([kind, i]) => kind === 'income' ? 'income' : catOf(i);
  const rowHtml = ([kind, i]) => {
    const prev = prevOf(kind, i);
    const where = kind === 'income' ? (accountById(i.acc) ? accountById(i.acc).name : '') : payLabel(i);
    return '<label class="cell form bulk-row' + (i.pending ? ' is-pend' : '') + '"><span class="grow"><span class="title">' + esc(i.name) + '</span><span class="sub">' + esc(where) + '</span><span class="sub">' + (prev != null ? '先月 ' + yen(prev) : '') + '<span class="bk-diff" data-diff="' + i.id + '"></span></span></span>' +
      '<input class="num" type="text" inputmode="numeric" enterkeyhint="next" data-bk="' + kind + ':' + i.id + '" data-prev="' + (prev != null ? prev : '') + '" value="' + (i.pending ? '' : fmtInput(i.amount)) + '" placeholder="' + (prev != null ? fmtInput(prev) || '0' : '0') + '"><span class="unit">円</span></label>';
  };
  const body = (list.length ? '<div class="chips"><button type="button" class="chip" id="bkFill">空欄を先月と同じにする</button></div>' : '') +
    secs.map(([id, label]) => { const rows = list.filter(x => secOf(x) === id); return rows.length ? '<div class="group-head"><span>' + label + '</span></div><div class="group">' + rows.map(rowHtml).join('') + '</div>' : ''; }).join('') +
    (list.length ? '<div class="bk-sum" id="bkSum"></div>' + saveBtn('保存') : '<div class="empty-state"><p>入力するものはありません</p></div>');
  openSheet({ title: '変動する金額', left: 'キャンセル', right: '保存', body, onRight: () => saveBulk() });
  const inputs = [...$('sheetBody').querySelectorAll('[data-bk]')];
  const find = key => { const [kind, id] = key.split(':'); return [kind, m[kind].find(x => x.id === id)]; };
  const valOf = inp => inp.value.trim() === '' ? null : parseAmount(inp.value);
  // 入れている途中の黒字・赤字と、先月から大きく変わったものの印
  const refresh = () => {
    const over = new Map(inputs.map(inp => { const v = valOf(inp); return [inp.dataset.bk.split(':')[1], v]; }));
    const val = i => over.has(i.id) && Number.isFinite(over.get(i.id)) ? over.get(i.id) : i.amount;
    const inc = sum(m.income.map(val));
    const spend = sum(m.out.filter(i => catOf(i) !== 'saving').map(i => i.withdraw ? -val(i) : val(i)));
    const surplus = inc - spend;
    $('bkSum').innerHTML = '<span>' + (surplus >= 0 ? '黒字' : '赤字') + 'の見込み</span><b class="' + (surplus >= 0 ? 'ok' : 'ng') + '">' + yenS(surplus) + '</b>';
    inputs.forEach(inp => {
      const el = $('sheetBody').querySelector('[data-diff="' + inp.dataset.bk.split(':')[1] + '"]');
      const v = valOf(inp), pv = inp.dataset.prev === '' ? null : +inp.dataset.prev;
      if (!el) return;
      if (v == null || !Number.isFinite(v) || pv == null || pv === 0) { el.textContent = ''; el.className = 'bk-diff'; return; }
      const r = (v - pv) / pv;
      el.textContent = Math.abs(r) >= 0.3 ? '（' + (r > 0 ? '+' : '') + pct(r) + '）' : '';
      el.className = 'bk-diff' + (Math.abs(r) >= 0.3 ? ' big' : '');
    });
  };
  inputs.forEach((inp, k) => {
    amountInput(inp);
    inp.addEventListener('input', refresh);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const nx = inputs[k + 1]; if (nx) nx.focus(); else inp.blur(); } });
  });
  if ($('bkFill')) $('bkFill').addEventListener('click', () => { inputs.forEach(inp => { if (inp.value.trim() === '' && inp.dataset.prev !== '') inp.value = fmtInput(+inp.dataset.prev) || '0'; }); refresh(); });
  if (list.length) refresh();
  function saveBulk() {
    let n = 0, bad = 0;
    inputs.forEach(inp => {
      const v = valOf(inp);
      if (v == null) return;
      if (!Number.isFinite(v)) { bad++; return; }
      const [, it] = find(inp.dataset.bk);
      if (!it) return;
      if (it.amount !== v || it.pending) n++;
      it.amount = v; it.pending = false;
    });

    const rec = { name, amount: n, acc: $('iAcc').value, memo: $('iMemo').value.trim(), repeat: rep, pending: false, ...(cat ? { cat } : {}) };
    if (cat === 'saving' && wd) rec.withdraw = true; else if (it) delete it.withdraw;
    if (it) delete it.fixed;
    if (it) {
      const later = Object.keys(state.months).filter(k => k > viewMonth).sort();

      const keys = ['name', 'acc', 'memo', 'cat', 'repeat'];

      if (same.length && changed) {

        if (ok === true) same.forEach(([, x]) => { keys.forEach(k => { if (rec[k] !== undefined) x[k] = rec[k]; }); if (rec.withdraw) x.withdraw = true; else delete x.withdraw; delete x.fixed; });
      }

    if (it) Object.assign(it, rec); else m[kind].push({ id: uid(), ...rec });
    save(); render(); toast(it ? '保存しました' : '追加しました');
    if (kind === 'out' && !presetCat && (!it || rec.acc !== presetAcc)) { const pa = payAccOf(rec); accountSheet(pa ? pa.id : ''); } else if (back) back(); else closeSheet();
  };
  openSheet({ title: it ? '変更' : (kind === 'income' ? '入ってくるお金を追加' : '払うものを追加'), left: 'キャンセル', right: it ? '保存' : '追加', onLeft: back,
    body: '<form id="iForm" autocomplete="off"><div class="group">' +
      '<label class="cell form"><span class="label">なまえ</span><input type="text" id="iName" list="dlNames" maxlength="40" value="' + esc(v.name) + '" placeholder="' + (kind === 'income' ? '例：夫給与' : '例：電気代') + '"></label>' +

      '<label class="cell form"><span class="label">メモ</span><input type="text" id="iMemo" maxlength="100" value="' + esc(v.memo) + '" placeholder="なし"></label>' +
      '</div>' + (cat ? catBlock(cat, rep, wd) : '<div class="group"><div class="cell seg-cell"><span class="title">来月は</span>' + repeatSeg(rep) + '<span class="sub" id="repNote">' + REPEATS.find(r => r[0] === rep)[2] + '</span></div></div>') + saveBtn(it ? '保存' : '追加') +
      (it ? '<div class="group"><button type="button" class="cell link center-cell" id="iDel"><span class="title red">この項目を削除</span></button></div>' : '') +

  const syncAcc = () => { const a = accountById($('iAcc').value); $('iAccText').textContent = a ? a.name : '決めない'; };

/* ---------- コードでデータを移す（ファイルを使わずに戻せるように） ---------- */
const CODE_PREFIX = 'KAKEIBO1:';
async function encodeCode(obj) {
  const bytes = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return CODE_PREFIX + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function decodeCode(text) {
  const t = String(text).trim();
  if (t.startsWith('{')) return JSON.parse(t);
  let b = t.replace(/^KAKEIBO1[:：]/, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
}
function codeRestoreSheet() {
  openSheet({ title: 'コードで戻す', left: 'キャンセル', right: '戻す',
    body: '<p class="sheet-lead">もらったコード（KAKEIBO1: で始まる文字）をコピーして、下に貼り付けてください。</p>' +
      '<div class="group"><textarea id="codeBox" class="code-box" rows="7" placeholder="ここに貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>' +
      '<p class="group-foot">今の内容は、コードの内容に置き換わります。</p>' + saveBtn('戻す'),
    onRight: async () => {
      let obj;
      try { obj = await decodeCode($('codeBox').value); } catch (e) { toast('コードを読めませんでした。最後までコピーできているか確かめてください'); return; }
      const next = normalizeState(obj);
      if (!Object.keys(next.months).length) { toast('このコードにはデータがありません'); return; }
      if (!await confirmDanger('このデータに置き換えますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を戻します。今の内容は置き換わります。', '戻す')) return;
      closeSheet(); useImported(next, 'データを戻しました');
    } });
}
function useImported(next, msg) {
  state = next; save();
  const cur = monthKey(new Date());
  if (!state.months[cur] && latestMonthBefore(cur)) copyMonth(cur, latestMonthBefore(cur));
  viewMonth = cur; showView('plan'); toast(msg);
}
// リンク（…/#import=KAKEIBO1:…）を開いたら、そのデータを入れる。
// 「#」より後ろはサーバーに送られないので、データはこのスマホの中だけで読まれる
async function importFromLink() {
  const h = location.hash;
  if (h.startsWith('#patch=')) return patchFromLink(h.slice(7));
  if (!h.startsWith('#import=')) return;
  history.replaceState(null, '', location.pathname + location.search);   // 履歴・再読み込みで二度入らないように消す
  let next;
  try { next = normalizeState(await decodeCode(decodeURIComponent(h.slice(8)))); } catch (e) { toast('リンクのデータを読めませんでした'); return; }
  if (!Object.keys(next.months).length) { toast('リンクにデータがありません'); return; }
  const has = Object.keys(state.months).length;
  if (has && !await confirmDanger('リンクのデータを入れますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を入れます。今の内容は置き換わります。', '入れる')) return;
  useImported(next, 'データを入れました');
}

// 直しだけのリンク（…/#patch=KAKEIBO1:…）：今のデータは残したまま、口座の名前・名義・用途だけを書き換える
async function patchFromLink(raw) {
  history.replaceState(null, '', location.pathname + location.search);
  let obj;
  try { obj = await decodeCode(decodeURIComponent(raw)); } catch (e) { toast('リンクを読めませんでした'); return; }
  const patch = obj && obj.app === 'kakeibo' && obj.patch;
  const want = patch && typeof patch.accounts === 'object' && patch.accounts ? patch.accounts : {};
  const renames = patch && typeof patch.items === 'object' && patch.items ? patch.items : {};
  const order = patch && Array.isArray(patch.order) ? patch.order.filter(id => accountById(id)) : [];
  const orderChanged = order.length > 1 && order.some((id, k) => state.accounts.filter(a => order.includes(a.id))[k].id !== id);
  if (!patch) { toast('リンクに直す内容がありません'); return; }
  // 項目の名前（例：「①給与Y」→「給与Y」）
  const itemHits = [];
  for (const m of Object.values(state.months)) for (const i of [...m.income, ...m.out]) {
    const to = renames[i.name];
    if (typeof to === 'string' && to.trim() && to.trim() !== i.name) itemHits.push({ i, to: to.trim().slice(0, 40) });
  }
  const changes = [];
  for (const [id, v] of Object.entries(want)) {
    const a = accountById(id);
    if (!a || !v || typeof v !== 'object') continue;
    const next = {};
    for (const k of ['name', 'owner', 'use']) if (typeof v[k] === 'string' && v[k].trim() !== (a[k] || '')) next[k] = v[k].trim().slice(0, 40);
    if (next.name === '') delete next.name;
    if (Object.keys(next).length) changes.push({ a, next });
  }
  const missing = Object.keys(want).filter(id => !accountById(id)).length;
  if (!changes.length && !itemHits.length && !orderChanged) { toast(missing ? '直す口座が見つかりませんでした' : 'もう同じ内容です'); return; }
  const list = changes.map(c => c.next.name ? c.a.name + ' → ' + c.next.name : c.next.use !== undefined ? c.a.name + 'の用途 → ' + (c.next.use || 'なし') : c.a.name + 'の名義')
    .concat([...new Set(itemHits.map(h => h.i.name + ' → ' + h.to))]).concat(orderChanged ? ['口座の並び順：' + order.map(id => accountById(id).name).join(' → ')] : []).join('、');
  if (await ask(changes.length || itemHits.length ? '名前を変えますか？' : '並び順を変えますか？', list + (missing ? '（見つからない口座が ' + missing + ' 件あります）' : '') + '。金額などほかの内容はそのままです。', [{ label: '変える', value: true }]) !== true) return;
  changes.forEach(c => Object.assign(c.a, c.next));
  itemHits.forEach(h => { h.i.name = h.to; });
  if (orderChanged) {
    const listed = order.map(id => accountById(id));
    const slots = state.accounts.map((a, k) => order.includes(a.id) ? k : -1).filter(k => k >= 0);
    slots.forEach((k, n) => { state.accounts[k] = listed[n]; });
  }
  save(); render(); toast('変えました');
}

function enableDragSort(handle) {

/* =========================================================
   スワイプ（行を左に動かすと操作ボタンが出る。大きく動かすとそのまま実行）
   ========================================================= */
let openSwipe = null;
function enableSwipe(el) {
  const content = el.querySelector('.swipe-content');
  const actions = el.querySelector('.swipe-actions');
  let sx = 0, sy = 0, dx = 0, base = 0, active = false, decided = false, horizontal = false;
  const set = (x, anim) => { content.style.transition = anim ? 'transform .25s cubic-bezier(.2,.8,.2,1)' : 'none'; content.style.transform = 'translateX(' + x + 'px)'; };
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (openSwipe && openSwipe !== el) openSwipe.close();
    sx = e.clientX; sy = e.clientY; dx = 0; active = true; decided = false; horizontal = false;
    base = el.classList.contains('open') ? -actions.offsetWidth : 0;
  });
  el.addEventListener('pointermove', e => {
    if (!active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { decided = true; horizontal = Math.abs(mx) > Math.abs(my); if (horizontal) { el.setPointerCapture(e.pointerId); el.classList.add('moving'); } }
    if (!horizontal) return;
    e.preventDefault();
    dx = Math.min(0, base + mx);
    set(dx, false);
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (!horizontal) return;
    el.dataset.swiped = '1'; setTimeout(() => delete el.dataset.swiped, 50);
    const w = actions.offsetWidth;
    if (-dx > el.offsetWidth * 0.55) { set(-el.offsetWidth, true); setTimeout(() => actions.querySelector('button').click(), 180); return; }
    if (-dx > w / 2) { set(-w, true); el.classList.add('open'); openSwipe = el; } else el.close();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if (el.dataset.swiped) { e.stopPropagation(); e.preventDefault(); } }, true);
  el.close = () => { set(0, true); el.classList.remove('open'); setTimeout(() => { if (!el.classList.contains('open')) el.classList.remove('moving'); }, 260); if (openSwipe === el) openSwipe = null; };
}
document.addEventListener('pointerdown', e => { if (openSwipe && !openSwipe.contains(e.target)) openSwipe.close(); });

// 共有シート（iPhone なら「Googleドライブ」や「"ファイル"に保存」を選べる）。使えなければふつうに保存
async function shareOrDownload(name, text, type) {
  try {
    const file = new File([text], name, { type: type || 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  download(name, text, type);
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvCell(v) {
  let s = String(v ?? '');

  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

const HEAD = ['月', '種類', 'なまえ', '口座', '金額', 'メモ', '区分'];
function toCSV() {
  const lines = [HEAD.join(',')];
  for (const mk of Object.keys(state.months).sort()) {
    const m = state.months[mk];
    for (const [kind, label] of [['income', '入ってくる'], ['out', '払う']]) for (const i of m[kind]) lines.push([mk, label, i.name, accountById(i.acc) ? accountById(i.acc).name : '', kind === 'out' ? amt(i) : i.amount, i.memo, kind === 'out' ? catLabel(catOf(i)) : ''].map(csvCell).join(','));

function parseCSV(text) {

    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
$('fileJson').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let obj; try { obj = JSON.parse(await f.text()); } catch (err) { toast('ファイルを読めませんでした'); return; }
  const next = normalizeState(obj);
  if (!await confirmDanger('バックアップから戻しますか？', Object.keys(next.months).length + 'か月分・口座 ' + next.accounts.length + '件を戻します。今の内容は置き換わります。', '戻す')) return;
  state = next; save(); toast('戻しました'); showView('plan');
});
$('fileCsv').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let text = await f.text();
  if (text.includes('�')) { try { text = new TextDecoder('shift_jis').decode(await f.arrayBuffer()); } catch (err) { /* ignore */ } }
  const rows = parseCSV(text);
  const head = (rows[0] || []).map(h => h.trim());
  const c = n => head.indexOf(n);
  if (c('月') < 0 || c('種類') < 0 || c('なまえ') < 0) { await ask('読み込めませんでした', '1行目は「' + HEAD.join(',') + '」にしてください（区分は省略できます）。', [{ label: 'OK', value: true }]); return; }
  const byMonth = {};
  const catCol = c('区分') >= 0 ? c('区分') : c('分類');   // 前の版の CSV は「分類」
  for (const r of rows.slice(1)) {
    const mm = toHalf(r[c('月')] || '').trim().match(/^(\d{4})[-\/.年](\d{1,2})/);
    if (!mm) continue;
    const mk = mm[1] + '-' + pad(+mm[2]);
    const kind = (r[c('種類')] || '').includes('入') ? 'income' : 'out';
    const accName = (c('口座') >= 0 ? r[c('口座')] : '').trim();
    let acc = accName ? state.accounts.find(a => a.name === accName) : null;
    if (accName && !acc) { acc = { id: 'a_' + uid(), name: accName, kind: accName === '手持ち' ? 'cash' : 'bank' }; state.accounts.push(acc); }
    const amt = c('金額') >= 0 ? parseAmount(r[c('金額')] || '0') : 0;
    (byMonth[mk] = byMonth[mk] || { income: [], out: [], done: {} })[kind].push({ id: uid(), name: (r[c('なまえ')] || '').trim().replace(/^'(?=[=+\-@])/, ''), acc: acc ? acc.id : '', amount: Number.isFinite(amt) ? Math.abs(amt) : 0, ...(kind === 'out' && amt < 0 ? { withdraw: true } : {}), memo: c('メモ') >= 0 ? (r[c('メモ')] || '').trim() : '', ...(kind === 'out' ? { cat: (CATS.find(x => catCol >= 0 && (r[catCol] || '').trim() === x[1]) || [guessCat(r[c('なまえ')])])[0] } : {}) });
  }
  const ks = Object.keys(byMonth).sort();
  if (!ks.length) { toast('読み込める行がありませんでした'); return; }
  if (!await confirmDanger(ks.length + 'か月分を読み込みますか？', monthLabel(ks[0]) + '〜' + monthLabel(ks[ks.length - 1]) + '。同じ月があれば置き換わります。', '読み込む')) return;
  for (const k of ks) state.months[k] = byMonth[k];
  save(); toast('読み込みました'); render();
});

/* =========================================================
   下から出る画面（iPhone のシートと同じ形）・確認（アクションシート）・お知らせ
   ========================================================= */
let sheetLeft = null, sheetRight = null;
function openSheet(o) {
  if (openSwipe) openSwipe.close();
  $('sheetTitle').textContent = o.title || '';
  $('sheetLeft').textContent = o.left || '閉じる';
  sheetLeft = o.onLeft || null;
  const r = $('sheetRight');
  r.hidden = !o.right;
  r.innerHTML = o.right || '';
  r.setAttribute('aria-label', o.rightLabel || (r.textContent || ''));
  r.classList.toggle('icon-only', !!o.rightLabel);
  sheetRight = o.onRight || null;
  $('sheetBody').innerHTML = o.body || '';
  $('sheetBody').querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', () => { if (sheetRight) sheetRight(); }));
  $('sheetBody').scrollTop = 0;
  const wasOpen = $('sheet').classList.contains('open');
  $('sheetBack').classList.add('open');
  $('sheet').classList.add('open');
  $('sheet').style.transform = '';
  if (wasOpen) { $('sheetBody').classList.remove('fade'); void $('sheetBody').offsetWidth; $('sheetBody').classList.add('fade'); }
}
function closeSheet() {
  $('sheet').classList.remove('open');
  $('sheetBack').classList.remove('open');
  $('sheet').style.transform = '';
  if (document.activeElement) document.activeElement.blur();
}
$('sheetLeft').addEventListener('click', () => { if (sheetLeft) sheetLeft(); else closeSheet(); });
$('sheetRight').addEventListener('click', () => { if (sheetRight) sheetRight(); });
$('sheetBack').addEventListener('click', () => closeSheet());
// 上の部分（つまみ・題名）を下に引っ張ると閉じる
(() => {
  const sheet = $('sheet'), grip = $('sheetGrip');
  let sy = 0, dy = 0, on = false;
  grip.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; on = true; sy = e.clientY; dy = 0; grip.setPointerCapture(e.pointerId); sheet.style.transition = 'none'; });
  grip.addEventListener('pointermove', e => { if (!on) return; dy = Math.max(0, e.clientY - sy); sheet.style.transform = 'translateY(' + dy + 'px)'; });
  const end = () => { if (!on) return; on = false; sheet.style.transition = ''; if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
})();

// 確認：画面の下から出るボタンの並び（iPhone のアクションシート）
let askResolve = null;
function ask(title, text, buttons) {
  return new Promise(resolve => {
    if (askResolve) askResolve(undefined);
    askResolve = resolve;
    const box = $('actionBox');
    box.innerHTML = '<div class="as-group"><div class="as-msg"><b>' + esc(title) + '</b>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</div>' +
      buttons.map((b, i) => '<button class="as-btn' + (b.danger ? ' red' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div>' +
      '<div class="as-group"><button class="as-btn bold" data-cancel>キャンセル</button></div>';
    const done = v => { $('actionBack').classList.remove('open'); const r = askResolve; askResolve = null; if (r) r(v); };
    box.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => done(buttons[+b.dataset.i].value)));
    box.querySelector('[data-cancel]').addEventListener('click', () => done(undefined));
    $('actionBack').onclick = e => { if (e.target === $('actionBack')) done(undefined); };
    $('actionBack').classList.add('open');
  });
}
function confirmDanger(title, text, label) {
  return ask(title, text, [{ label: label || '削除', value: true, danger: true }]).then(v => v === true);
}

function amountInput(inp) {
  inp.addEventListener('input', () => {
    const d = toHalf(inp.value).replace(/[^\d]/g, '');
    inp.value = d ? nf.format(parseInt(d, 10)) : '';
  });
}
let toastTimer, toastFn = null;
function toast(msg, actionLabel, fn) {
  const t = $('toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button id="toastAct">' + esc(actionLabel) + '</button>' : '');
  toastFn = fn || null;
  if (actionLabel) $('toastAct').addEventListener('click', () => { const f = toastFn; toastFn = null; t.classList.remove('show'); if (f) f(); });
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastFn = null; }, actionLabel ? 4500 : 2200);
}

applyTheme(getTheme());
(() => {
  const cur = monthKey(new Date()), prev = latestMonthBefore(cur);
  if (!state.months[cur] && prev) { copyMonth(cur, prev); setTimeout(() => toast(monthLabel(cur) + 'を先月から作りました'), 300); }

importFromLink();
window.addEventListener('hashchange', importFromLink);   // アプリを開いたままリンクを開いたとき
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
